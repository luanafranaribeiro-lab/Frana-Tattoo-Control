<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E4ECF5;
    --surface:#FAFCFE;
    --surface-2:#DCE7F3;
    --border:#BDD0E3;
    --text:#16232F;
    --text-muted:#5E7286;
    --accent:#2159A0;
    --accent-contrast:#FAFCFE;
    --positive:#3D7A55;
    --warning:#A66A12;
    --danger:#C0392B;
    --tint:#E4EEFB;
    --radius-s:6px;
    --radius-m:12px;
    --radius-l:20px;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1621;
      --surface:#161E2B;
      --surface-2:#202B3C;
      --border:#324058;
      --text:#E7EDF6;
      --text-muted:#8C9BB2;
      --accent:#5B9EE6;
      --accent-contrast:#0F1621;
      --positive:#82C08F;
      --warning:#E0A85C;
      --danger:#EF5B4E;
      --tint:#1A2740;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1621;
    --surface:#161E2B;
    --surface-2:#202B3C;
    --border:#324058;
    --text:#E7EDF6;
    --text-muted:#8C9BB2;
    --accent:#5B9EE6;
    --accent-contrast:#0F1621;
    --positive:#82C08F;
    --warning:#E0A85C;
    --danger:#EF5B4E;
    --tint:#1A2740;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 600px at 15% -10%, rgba(33,89,160,.07), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(33,89,160,.05), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:-0.01em;}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent);color:var(--accent-contrast);}

  #app{display:flex;min-height:100vh;}

  /* ---------- NAV ---------- */
  #nav{
    width:236px;flex-shrink:0;
    display:flex;flex-direction:column;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:22px 14px;
    position:sticky;top:0;height:100vh;
  }
  .brand{padding:2px 10px 22px;}
  .brand-mark{font-size:22px;font-family:var(--font-display);font-weight:700;line-height:1.15;}
  .brand-mark span{color:var(--accent);}
  .brand-sub{font-size:12px;color:var(--text-muted);margin-top:4px;font-style:italic;}
  .navlist{display:flex;flex-direction:column;gap:2px;flex:1;}
  .navitem{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:var(--radius-s);

  .dash-hero-label{display:flex;align-items:center;gap:7px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);font-weight:700;margin-bottom:10px;}

  .evchart-header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .evchart-total{text-align:right;}
  .evchart-total-label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;margin-bottom:2px;}
  .evchart-total-value{font-family:var(--font-mono);font-size:24px;font-weight:700;}
  .evchart-total-value.pos{color:var(--positive);}
  .evchart-total-value.neg{color:var(--danger);}
  .evchart-bar-value{font-family:var(--font-mono);font-size:10px;font-weight:700;white-space:nowrap;margin-bottom:3px;}
  .evchart-bar-value.pos{color:var(--positive);}
  .evchart-bar-value.neg{color:var(--danger);}
  .evchart-card{border-radius:var(--radius-l);padding:16px 16px 6px;margin-bottom:18px;box-shadow:0 4px 16px rgba(0,0,0,.12);color:#fff;}
  .evchart-card.pos{background:linear-gradient(150deg, var(--positive) 0%, #0F3D22 140%);}
  .evchart-card.neg{background:linear-gradient(150deg, var(--danger) 0%, #4A1410 140%);}
  .evchart-card .section-title{color:rgba(255,255,255,.85);margin-top:0;}
  .evchart-card .evchart-total-label{color:rgba(255,255,255,.72);}
  .evchart-card .evchart-total-value{color:#fff;}
  .evchart-card .evchart-bar-value{color:rgba(255,255,255,.9);}
  .evchart-card .evchart-bar-track{background:rgba(255,255,255,.18);}
  .evchart-card .evchart-bar.pos{background:#fff;}
  .evchart-card .evchart-bar.neg{background:rgba(255,255,255,.45);}
  .evchart-card .evchart-bar-label{color:rgba(255,255,255,.65);}
  .evchart-card .evchart-bar-wrap.active .evchart-bar-label{color:#fff;font-weight:700;}
  .evchart-card .evchart-detail{border-top:1px solid rgba(255,255,255,.25);padding-top:12px;}
  .evchart-card .evchart-detail .row-title{color:#fff;}
  .evchart-card .evchart-detail .row-sub{color:rgba(255,255,255,.75);}
  .evchart-card .evchart-detail-lucro{font-family:var(--font-mono);font-size:22px;font-weight:700;margin:4px 0 10px;color:#fff;}
  .evchart-card .evchart-detail .row-card{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.2);}
  .evchart-card .evchart-detail .row-card .row-title{color:#fff;}
  .evchart-card .evchart-detail .row-card .row-sub{color:rgba(255,255,255,.7);}
  .chevron-indicator{display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-muted);}
  .chevron-indicator svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .shopping-alert-card{background:linear-gradient(150deg, rgba(230,178,30,.22) 0%, var(--surface) 82%);border-color:rgba(230,178,30,.35);}
  .row-card-tinted{background:linear-gradient(150deg, var(--tint) 0%, var(--surface) 82%);border-color:var(--border);}

  /* ---------- modal ---------- */
  #modal-root{position:relative;z-index:80;}
  #picker-root{position:relative;z-index:95;}
  .picker-backdrop{z-index:95;align-items:center;}
  .picker-backdrop .modal{max-width:330px;border-radius:var(--radius-l);border-bottom:1px solid var(--border);padding:16px 16px 18px;max-height:80vh;}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(8,13,22,.6);
    display:flex;align-items:flex-end;justify-content:center;z-index:80;
  }
  @media (min-width:640px){.modal-backdrop{align-items:center;}}
  .modal{
    background:var(--surface);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    border-radius:18px 18px 0 0;border:1px solid var(--border);border-bottom:none;
    padding:20px 20px 26px;
  }
  @media (min-width:640px){.modal{border-radius:var(--radius-l);border-bottom:1px solid var(--border);}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h3{font-size:19px;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .confirm-text{font-size:14px;line-height:1.5;margin-bottom:4px;}

  .banner{
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-s);
    padding:10px 13px;font-size:12.5px;color:var(--text-muted);margin-bottom:18px;display:flex;gap:8px;align-items:center;
  }
  .banner svg{width:15px;height:15px;stroke:var(--warning);fill:none;stroke-width:1.7;flex-shrink:0;}
  .classificar-banner{background:linear-gradient(150deg, rgba(230,178,30,.22) 0%, var(--surface) 82%);border-color:rgba(230,178,30,.4);cursor:pointer;color:var(--text);}

  .greet{position:relative;margin-bottom:24px;display:flex;align-items:center;gap:16px;}
  .greet::before{
    content:'';position:absolute;top:-55px;right:-30px;width:240px;height:240px;
    border-radius:50%;background:radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity:.14;pointer-events:none;z-index:0;
  }
  .greet-logo,.greet h1,.greet p{position:relative;z-index:1;}
  .greet-logo{
    width:88px;height:88px;flex-shrink:0;border-radius:50%;background:#0F1D29;
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.22);
  }
  .greet-logo img{width:80%;height:80%;object-fit:contain;}
  .greet h1{font-size:27px;}
  .greet p{color:var(--text-muted);font-size:13.5px;margin-top:5px;}

  #syncStatus{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);border-radius:999px;padding:5px 13px;font-size:11.5px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;max-width:92vw;text-align:center;}
  #syncStatus[data-kind="ok"]{color:var(--positive);border-color:var(--positive);}
  #syncStatus[data-kind="warn"]{color:var(--warning);border-color:var(--warning);}
  .app-version{text-align:center;font-size:10.5px;color:var(--text-muted);opacity:.7;padding:22px 0 8px;}
</style>
</head>

/* ---- aplicar alteração no estado local ---- */
function applyOpLocal(op){
  const arr = state[op.col]; if(!arr) return;
  const idx = arr.findIndex(x=>x.id===op.id);
  if(op.op==='upsert'){
    const doc = {id:op.id, ...cloneJson(op.data)};
    if(idx>=0) arr[idx] = doc; else arr.push(doc);
  } else if(op.op==='patch'){
    if(idx>=0) arr[idx] = {...arr[idx], ...cloneJson(op.patch)};
  } else if(op.op==='delete'){
    if(idx>=0) arr.splice(idx,1);
  }
}
function applyQueueOverState(){ queue.forEach(applyOpLocal); }
function hasPending(col,id){ return queue.some(o=>o.col===col && o.id===id); }

/* ---- fila: junta alterações do mesmo item pra não crescer à toa ---- */
function enqueue(newOp){
  newOp.q = uid();
  const same = o => o.col===newOp.col && o.id===newOp.id;
  if(newOp.op==='upsert' || newOp.op==='delete'){
    queue = queue.filter(o=> !(same(o) && !o.sending));   // o que já está sendo enviado não mexe
    queue.push(newOp);
  } else { // patch
    const last = [...queue].reverse().find(same);
    if(last && !last.sending && last.op==='upsert') last.data = {...last.data, ...newOp.patch};
    else if(last && !last.sending && last.op==='patch') last.patch = {...last.patch, ...newOp.patch};
    else if(last && !last.sending && last.op==='delete'){ /* item já apagado: ignora */ }
    else queue.push(newOp);
  }
}
function commitLocal(op){
  if(op.data!==undefined) op.data = cloneJson(op.data);
  if(op.patch!==undefined) op.patch = cloneJson(op.patch);
  applyOpLocal(op);
  if(currentUser){
    enqueue({...op});
    saveQueue(); saveCache();
  }
  renderApp();
  if(currentUser) kickFlush();
}

/* ---- erros ---- */
function isNetworkError(e){
  if(!navigator.onLine) return true;
  if(!e) return false;
  if(e.name==='AuthRetryableFetchError') return true;
  if(e.code || (e.status && e.status!==0)) return false;   // o servidor respondeu
  return /failed to fetch|load failed|network|fetch|timeout|offline/i.test(String(e.message||e));
}
function isAuthError(res){
  const e = res && res.error; if(!e) return false;
  return res.status===401 || e.code==='PGRST301' || e.code==='PGRST303' || /jwt/i.test(e.message||'');
}

/* ---- sessão ---- */
async function confirmSession(){
  try{
    const r = await supa.auth.getSession();
    const session = r && r.data && r.data.session;
    if(session && session.user){
      if(session.user.id !== currentUser.id){ handleSessionExpired(); return false; }
      currentUser = session.user; sessionConfirmed = true; return true;
    }
    if(!navigator.onLine || (r && r.error && isNetworkError(r.error))){ netDown = true; hadOutage = true; return false; }
    handleSessionExpired(); return false;
  }catch(e){ netDown = true; hadOutage = true; return false; }
}
async function tryRefreshSession(){
  try{
    const r = await supa.auth.refreshSession();
    const s = r && r.data && r.data.session;
    if(s && s.user && currentUser && s.user.id===currentUser.id){ currentUser = s.user; return true; }
  }catch(e){}
  return false;
}
function handleSessionExpired(){
  if(needRelogin) return;
  needRelogin = true; sessionConfirmed = false;
  if(realtimeChannel && supa){ try{ supa.removeChannel(realtimeChannel); }catch(e){} realtimeChannel = null; }
  try{ closeModal(); }catch(e){}
  showLoginScreen('Sua sessão expirou. Entre de novo pra mandar o que ficou salvo no celular — nada foi perdido.');
  renderSyncStatus();
}

/* ---- enviar a fila pro Supabase ---- */
async function sendOp(op){
  const uidUser = currentUser.id;
  const now = new Date().toISOString();
  if(op.op==='upsert'){
    return await supa.from('frana_docs').upsert({user_id:uidUser, col:op.col, id:op.id, data:op.data, atualizado_em:now}, {onConflict:'user_id,col,id'});
  }
  if(op.op==='delete'){
    return await supa.from('frana_docs').delete().eq('user_id',uidUser).eq('col',op.col).eq('id',op.id);
  }
  // patch: junta com o que está no servidor (não pisa em campos que o Financas mexeu e não ressuscita item apagado)
  const sel = await supa.from('frana_docs').select('data').eq('user_id',uidUser).eq('col',op.col).eq('id',op.id).maybeSingle();
  if(sel.error) return sel;
  if(!sel.data) return {error:null};
  const merged = {...(sel.data.data||{}), ...op.patch};
  return await supa.from('frana_docs').update({data:merged, atualizado_em:now}).eq('user_id',uidUser).eq('col',op.col).eq('id',op.id);
}
async function flushQueue(){
  if(flushing || !currentUser || !supa) return {sent:0};
  if(!navigator.onLine){ netDown = true; hadOutage = true; renderSyncStatus(); return {sent:0}; }
  flushing = true; flushSlow = false;
  clearTimeout(flushSlowTimer);
  flushSlowTimer = setTimeout(()=>{ if(flushing){ flushSlow = true; renderSyncStatus(); } }, 1200);
  renderSyncStatus();
  let sent = 0, authRetries = 0;
  try{
    if(!sessionConfirmed){ if(!(await confirmSession())) return {sent:0}; }
    while(queue.length){
      const op = queue[0];
      op.sending = true;
      let res;
      try{ res = await sendOp(op); }catch(e){ res = {error:e}; }
      if(res && res.error){
        op.sending = false;
        if(isAuthError(res)){
          if(authRetries<1 && await tryRefreshSession()){ authRetries++; continue; }
          handleSessionExpired(); return {sent};
        }
        if(isNetworkError(res.error)){ netDown = true; hadOutage = true; }
        else {
          lastSyncError = true; hadOutage = true;
          lastSyncErrorDetail = {op:op.op, col:op.col, id:op.id, message:(res.error&&res.error.message)||String(res.error), code:res.error&&res.error.code, status:res.status};
          console.error('Erro ao sincronizar', op, res.error);
        }
        return {sent};
      }
      queue = queue.filter(o=>o.q!==op.q);
      saveQueue(); sent++;
    }
    netDown = false; lastSyncError = false; lastSyncErrorDetail = null;
    if(sent>0) markSynced();
    return {sent};
  } finally {
    flushing = false; flushSlow = false; clearTimeout(flushSlowTimer); renderSyncStatus();
  }
}
function kickFlush(){
  if(!currentUser || !supa) return;
  if(!navigator.onLine){ netDown = true; hadOutage = true; renderSyncStatus(); return; }
  flushQueue().catch(e=>console.error(e));
}
async function syncNow(opts){
  opts = opts || {};
  if(!currentUser || !supa || needRelogin) return;
  if(syncRunning) return;
  syncRunning = true;
  try{
    if(navigator.onLine) netDown = false;
    await flushQueue();
    if(needRelogin || !sessionConfirmed || netDown || !navigator.onLine) return;
    if(opts.reload){
      const ok = await loadAllCollections();
      if(ok && hadOutage && !lastSyncError) markSynced();
    }
    if(sessionConfirmed && !realtimeChannel) subscribeRealtime();
  } finally {
    syncRunning = false; renderSyncStatus();
  }
}

/* ---- carregar do Supabase (e sobrepor o que ainda está na fila) ---- */
async function loadAllCollections(){
  if(!supa || !currentUser) return false;
  try{
    const { data: rows, error } = await supa.from('frana_docs').select('col,id,data').eq('user_id', currentUser.id);
    if(error){ if(isAuthError({error, status:error.status})){ handleSessionExpired(); return false; } throw error; }
    COLS.forEach(c=>state[c]=[]);
    (rows||[]).forEach(r=>{ if(state[r.col]) state[r.col].push({id:r.id, ...r.data}); });
    applyQueueOverState();
    saveCache();
    netDown = false;
    renderApp();
    return true;
  }catch(e){
    console.error('Erro ao carregar dados do Supabase', e);
    if(isNetworkError(e)){ netDown = true; hadOutage = true; } else { lastSyncError = true; lastSyncErrorDetail = {op:'carregar', col:'-', id:'-', message:(e&&e.message)||String(e), code:e&&e.code, status:e&&e.status}; }
    renderSyncStatus();
    return false;
  }
}
function subscribeRealtime(){
  if(!supa || !currentUser) return;
  if(realtimeChannel){ try{ supa.removeChannel(realtimeChannel); }catch(e){} realtimeChannel = null; }
  realtimeChannel = supa.channel('frana_docs_'+currentUser.id)
    .on('postgres_changes', {event:'*', schema:'public', table:'frana_docs', filter:`user_id=eq.${currentUser.id}`}, payload=>{
      const row = (payload.new && Object.keys(payload.new).length) ? payload.new : payload.old;
      if(!row || !state[row.col]) return;
      if(hasPending(row.col, row.id)) return;   // tem alteração minha esperando pra ir: ela vale mais
      if(payload.eventType==='DELETE'){
        state[row.col] = state[row.col].filter(x=>x.id!==row.id);
      } else {
        const doc = {id: row.id, ...row.data};
        const idx = state[row.col].findIndex(x=>x.id===row.id);
        if(idx>=0) state[row.col][idx] = doc; else state[row.col].push(doc);
      }
      saveCache();
      renderApp();
    })
    .subscribe();
}

/* ---- entrada / boot ---- */
function showApp(){
  document.getElementById('auth-root').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('logoutBtn').style.display = '';
}
async function bootAfterLogin(){
  needRelogin = false; sessionConfirmed = true;
  lsSet(LS_LAST_USER, JSON.stringify({id:currentUser.id, email:currentUser.email||''}));
  showApp();
  COLS.forEach(c=>state[c]=[]);
  loadQueue(currentUser.id);
  if(loadCache(currentUser.id)){ applyQueueOverState(); }
  renderApp();
  await syncNow({reload:true});
}
async function bootOffline(last){
  currentUser = {id:last.id, email:last.email||''};
  sessionConfirmed = false; needRelogin = false;
  netDown = !navigator.onLine || !supa; hadOutage = true;
  showApp();
  COLS.forEach(c=>state[c]=[]);
  loadQueue(last.id);
  loadCache(last.id);
  applyQueueOverState();
  renderApp();
  renderSyncStatus();
  if(navigator.onLine) syncNow({reload:true});
}
async function initDb(){
  registerServiceWorker();
  if(window.supabase && window.supabase.createClient){
    try{ supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ supa = null; console.error('Falha ao criar cliente Supabase', e); }
  }
  const last = readLastUser();
  window.addEventListener('online', ()=>{ netDown = false; renderSyncStatus(); syncNow({reload:true}); });
  window.addEventListener('offline', ()=>{ hadOutage = true; renderSyncStatus(); });
  setInterval(()=>{
    if(currentUser && !needRelogin && (queue.length>0 || netDown || hadOutage || lastSyncError)) syncNow({reload:true});
  }, 30000);

  if(!supa){
    if(last){ await bootOffline(last); return; }
    console.error('Supabase indisponível, entrando em modo prévia local.');
    document.getElementById('app').style.display = '';
    document.getElementById('auth-root').style.display = 'none';
    renderApp();
    return;
  }
  let session = null, sessErr = null, timedOut = false;
  if(last && !navigator.onLine){
    sessErr = {name:'AuthRetryableFetchError', message:'offline'};   // sem internet: nem tenta confirmar a sessão
  } else {
    const limit = new Promise(res=>setTimeout(()=>res('timeout'), 6000));   // internet ruim: não deixa a tela em branco
    const attempt = supa.auth.getSession().then(r=>({r})).catch(e=>({e}));
    const got = await Promise.race([attempt, limit]);
    if(got==='timeout'){ timedOut = true; }
    else if(got.r){ session = got.r.data && got.r.data.session; sessErr = got.r.error; }
    else sessErr = got.e;
  }
  if(session && session.user){
    currentUser = session.user;
    await bootAfterLogin();
  } else if(last && (timedOut || !navigator.onLine || (sessErr && isNetworkError(sessErr)))){
    await bootOffline(last);
  } else {
    showLoginScreen();
  }
  supa.auth.onAuthStateChange((event, sess)=>{
    if(event==='SIGNED_IN' && sess && sess.user){
      if(!currentUser || currentUser.id!==sess.user.id || !sessionConfirmed || needRelogin){
        currentUser = sess.user;
        bootAfterLogin();
      }
    } else if(event==='SIGNED_OUT'){
      const wasExplicit = explicitLogout; explicitLogout = false;
      if(realtimeChannel){ try{ supa.removeChannel(realtimeChannel); }catch(e){} realtimeChannel = null; }
      sessionConfirmed = false;
      if(wasExplicit || !currentUser){
        lsDel(LS_LAST_USER);
        currentUser = null; queue = [];
        COLS.forEach(c=>state[c]=[]);
        showLoginScreen();
      } else {
        handleSessionExpired();
      }
    }
  });
}
function registerServiceWorker(){
  if(!('serviceWorker' in navigator) || location.protocol!=='https:') return;
  try{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Service worker não registrado', e)); }catch(e){}
}
function showLoginScreen(info){
  document.getElementById('app').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('auth-root').style.display = 'flex';
  const infoEl = document.getElementById('loginInfo');
  if(infoEl) infoEl.textContent = info || '';
  const form = document.getElementById('loginForm');
  const pwInput = document.getElementById('loginPassword');
  document.getElementById('togglePasswordBtn').onclick = ()=>{
    pwInput.type = pwInput.type==='password' ? 'text' : 'password';
  };
  try{
    const remembered = localStorage.getItem('ftc-remember-email');
    if(remembered){ form.elements.email.value = remembered; document.getElementById('rememberMe').checked = true; }
  }catch(e){}
  form.onsubmit = async (e)=>{
    e.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    if(btn.disabled) return;
    btn.disabled = true;
    document.getElementById('loginError').textContent = '';
    const emailTyped = form.elements.email.value.trim();
    try{
      if(document.getElementById('rememberMe').checked) localStorage.setItem('ftc-remember-email', emailTyped);
      else localStorage.removeItem('ftc-remember-email');
    }catch(e){}
    if(!supa){
      document.getElementById('loginError').textContent = 'Não consegui carregar o sistema de login. Confira a internet e abra de novo.';
      btn.disabled = false; return;
    }
    let error = null;
    try{ ({ error } = await supa.auth.signInWithPassword({ email: emailTyped, password: form.elements.password.value })); }
    catch(err){ error = err; }
    if(error){
      const isNetworkErr = !navigator.onLine || /load failed|failed to fetch|network/i.test(error.message||'');
      document.getElementById('loginError').textContent = !navigator.onLine
        ? 'Sem internet. Pra entrar neste aparelho a primeira vez (ou depois de sair) você precisa estar online.'
        : isNetworkErr
          ? 'Não deu pra conectar ao banco daqui. Isso é esperado na prévia do Claude — teste no site publicado (GitHub Pages).'
          : 'E-mail ou senha incorretos.';
      btn.disabled = false;
    } else { btn.disabled = false; }
  };
}

async function colAdd(col, data){
  const id = uid();
  commitLocal({op:'upsert', col, id, data});
  return {id};
}
async function colUpdate(col, id, patch){
  commitLocal({op:'patch', col, id, patch});
}
async function colDelete(col, id){
  commitLocal({op:'delete', col, id});
}
async function colUpsert(col, id, data){
  commitLocal({op:'upsert', col, id, data});
}
function getFuelDefaults(){
  const s = state.settings.find(x=>x.id==='combustivel');
  return s || {consumo:'', precoLitro:''};
}

async function adjustStock(stockId, delta){
  const item = state.stock.find(s=>s.id===stockId);
  if(!item) return;
  await colUpdate('stock', stockId, {quantity: round2((item.quantity||0)+delta)});
}
async function applyConsumptions(consumptions){
  for(const c of consumptions){ if(c.stockId && c.qty){ await adjustStock(c.stockId, -Math.abs(c.qty)); } }
}
async function revertConsumptions(consumptions){
  for(const c of consumptions){ if(c.stockId && c.qty){ await adjustStock(c.stockId, Math.abs(c.qty)); } }
}
function buildConsumptionSnapshot(raw){
  return raw.filter(c=>c.stockId && Number(c.qty)>0).map(c=>{
    const item = state.stock.find(s=>s.id===c.stockId);
    return { stockId:c.stockId, qty:Number(c.qty), name:item?item.name:'Item removido', unit:item?item.unit:'', cost:item?(item.costPerUnit||0):0 };
  });
}
function consumptionsCost(consumptions){ return consumptions.reduce((s,c)=>s+(c.qty*c.cost),0); }

/* ============ DERIVED ============ */
function tattooProfit(t){ return round2((t.value||0) - (t.costTotal||0)); }
function eventTattoos(eventId){ return state.tattoos.filter(t=>t.eventId===eventId); }
function eventExpensesTotal(ev){ return (ev.expenses||[]).reduce((s,e)=>s+(e.value||0),0); }
function eventFaturamento(eventId){ return eventTattoos(eventId).reduce((s,t)=>s+(t.value||0),0); }
function eventMateriais(eventId){ return eventTattoos(eventId).reduce((s,t)=>s+(t.costTotal||0),0); }
function stockValueTotal(){ return state.stock.reduce((s,i)=>s+((i.quantity||0)*(i.costPerUnit||0)),0); }
function cartuchoGroupKey(item){ return `${(item.numeracao||'').trim()}${(item.configuracao||'').trim()}`.toUpperCase(); }
function cartuchoGroupItems(key){ return state.stock.filter(s=>s.category==='cartucho' && cartuchoGroupKey(s)===key); }
function cartuchoGroupTotal(key){ return cartuchoGroupItems(key).reduce((sum,s)=>sum+(Number(s.quantity)||0),0); }
function cartuchoGroupMin(key){ return Math.max(0, ...cartuchoGroupItems(key).map(s=>Number(s.minStock)||0)); }
function isLowStock(s){
  if(s.category==='cartucho'){
    const key = cartuchoGroupKey(s);
    if(key) return cartuchoGroupTotal(key) <= cartuchoGroupMin(key);
  }
  return (Number(s.quantity)||0) <= (Number(s.minStock)||0);
}
function lowStockItems(){ return state.stock.filter(isLowStock); }
async function syncCartuchoGroupMin(key, minStock, exceptId){
  if(!key) return;
  for(const s of cartuchoGroupItems(key)){
    if(s.id===exceptId) continue;
    if((Number(s.minStock)||0) !== (Number(minStock)||0)) await colUpdate('stock', s.id, {minStock});
  }
}

function renderTattoos(){
  const all = tattoosMonth===null;
  const months = {};
  state.tattoos.forEach(t=>{
    const ev = t.eventId ? state.events.find(e=>e.id===t.eventId) : null;
    const ym = ev ? ((ev.date||'').slice(0,7) || 'sem-data') : ((t.date||'').slice(0,7) || 'sem-data');
    if(!all && ym!==tattoosMonth) return;
    if(!months[ym]) months[ym] = {events:{}, loose:[]};
    if(ev) (months[ym].events[ev.id] = months[ym].events[ev.id]||[]).push(t);
    else months[ym].loose.push(t);
  });
  const sortedMonths = Object.keys(months).sort((a,b)=>b.localeCompare(a));
  const monthsHtml = sortedMonths.map(ym=>{
    const group = months[ym];
    const eventIds = Object.keys(group.events).sort((a,b)=>{
      const da = group.events[a].map(t=>t.date||'').sort().pop()||'', db = group.events[b].map(t=>t.date||'').sort().pop()||'';
      return db.localeCompare(da);
    });
    const eventCardsHtml = eventIds.map(eid=>{
      const ev = state.events.find(e=>e.id===eid);
      const evTattoos = [...group.events[eid]].sort(sortByDateDesc);
      const qtd = evTattoos.length;
      const faturamento = evTattoos.reduce((s,t)=>s+(t.value||0),0);
      const gasto = round2(evTattoos.reduce((s,t)=>s+(t.costTotal||0),0) + eventExpensesTotal(ev));
      const lucro = round2(faturamento - gasto);
      return `
        <div class="row-card row-card-tinted" data-action="openEventFromTattoos" data-id="${eid}" style="cursor:pointer;">
          <div>
            <div class="row-title">${escapeHtml(ev.name)}</div>
            <div class="row-sub">${qtd} tattoo${qtd===1?'':'s'} · gasto ${brl(gasto)} · lucro <span style="color:${lucro>=0?'var(--positive)':'var(--danger)'}">${brl(lucro)}</span></div>
          </div>
        </div>`;
    }).join('');
    const looseRowsHtml = [...group.loose].sort(sortByDateDesc).map(t=>tattooRow(t)).join('');
    return `
      <div class="section-title">${ym==='sem-data'?'Sem data':monthLabel(ym)}</div>
      <div class="list">${eventCardsHtml}${looseRowsHtml}</div>
    `;
  }).join('');
  return `
    ${connBannerHtml()}
    <div class="page-head"><h1>Tattoos</h1>
      <button class="btn" data-action="openTattooForm">${ICONS.plus} Registrar tattoo</button>
    </div>
    <div class="page-head" style="margin-bottom:16px;">
      <div class="month-nav">
        ${all ? `<span class="month-label">Todo o período</span>` : `
        <button class="icon-btn" data-action="tattoosPrevMonth">${ICONS.chevL}</button>
        <span class="month-label">${monthLabel(tattoosMonth)}</span>
        <button class="icon-btn" data-action="tattoosNextMonth">${ICONS.chevR}</button>`}
      </div>
      <button class="chip ${all?'active':''}" data-action="tattoosToggleAll">${all?'Ver por mês':'Ver tudo'}</button>
    </div>
    ${sortedMonths.length? monthsHtml : `<div class="empty">Nenhuma tattoo registrada ${all?'ainda':'neste mês'}.</div>`}
  `;
}

let selectedMonthChart = null;
function selectMonthChart(ym){ selectedMonthChart = (selectedMonthChart===ym) ? null : ym; renderApp(); }
function eventosChartHtml(){
  if(!state.events.length) return '';
  const months = {};
  state.events.forEach(ev=>{
    const ym = (ev.date||'').slice(0,7) || 'sem-data';
    const fat = eventFaturamento(ev.id), mat = eventMateriais(ev.id), desp = eventExpensesTotal(ev);
    if(!months[ym]) months[ym] = {events:[], fat:0, mat:0, desp:0};
    months[ym].events.push({ev, fat, mat, desp, lucro:round2(fat-mat-desp)});
    months[ym].fat += fat; months[ym].mat += mat; months[ym].desp += desp;
  });
  const sortedYms = Object.keys(months).sort();
  const data = sortedYms.map(ym=>{
    const m = months[ym];
    return {ym, events:m.events, fat:round2(m.fat), mat:round2(m.mat), desp:round2(m.desp), lucro:round2(m.fat-m.mat-m.desp)};
  });
  const totalLucro = round2(data.reduce((s,d)=>s+d.lucro,0));
  const maxAbs = Math.max(1, ...data.map(d=>Math.abs(d.lucro)));
  const bars = data.map(d=>{
    const h = Math.max(4, Math.round((Math.abs(d.lucro)/maxAbs)*100));
    const active = d.ym===selectedMonthChart;
    return `
      <div class="evchart-bar-wrap ${active?'active':''}" data-action="selectMonthChart" data-id="${d.ym}">
        <div class="evchart-bar-value">${brlCompact(d.lucro)}</div>
        <div class="evchart-bar-track"><div class="evchart-bar ${d.lucro>=0?'pos':'neg'}" style="height:${h}%;"></div></div>
        <div class="evchart-bar-label">${d.ym==='sem-data'?'—':monthLabel(d.ym).slice(0,3)}</div>
      </div>`;
  }).join('');
  const selected = data.find(d=>d.ym===selectedMonthChart) || null;
  return `
    <div class="evchart-card ${totalLucro>=0?'pos':'neg'}">
      <div class="evchart-header">
        <div class="section-title" style="margin-top:0;">Lucro por mês</div>
        <div class="evchart-total">
          <span class="evchart-total-label">Total</span>
          <span class="evchart-total-value">${brl(totalLucro)}</span>
        </div>
      </div>
      <div class="evchart-row">${bars}</div>
      ${selected? `
      <div class="evchart-detail">
        <div class="row-title">${selected.ym==='sem-data'?'Sem data':monthLabel(selected.ym)}</div>
        <div class="row-sub">faturamento ${brl(selected.fat)} · materiais ${brl(selected.mat)} · despesas ${brl(selected.desp)}</div>
        <div class="evchart-detail-lucro">${brl(selected.lucro)}</div>
        <div class="list">${selected.events.sort((a,b)=>(b.ev.date||'').localeCompare(a.ev.date||'')).map(d=>`
          <div class="row-card" data-action="openEventDetail" data-id="${d.ev.id}" style="cursor:pointer;padding:10px 12px;">
            <div><div class="row-title" style="font-size:13px;">${escapeHtml(d.ev.name)}</div><div class="row-sub">${fmtDateBR(d.ev.date)}</div></div>
            <span class="badge ${d.lucro>=0?'ok':'danger'}">${brl(d.lucro)}</span>
          </div>`).join('')}</div>
      </div>` : ``}
    </div>
  `;
}

function syncBranco(){
  activeConsumptions = activeConsumptions.filter(c=>c.kind!=='branco-auto');
  if(activeBranco){
    const white = findWhiteTinta(), copinho = findCopinho(), solid = findSolidificador();
    if(white) activeConsumptions.push({stockId:white.id, qty:0.5, kind:'branco-auto'});
    if(copinho) activeConsumptions.push({stockId:copinho.id, qty:1, kind:'branco-auto'});
    if(solid) activeConsumptions.push({stockId:solid.id, qty:0.2, kind:'branco-auto'});
  }
}
function syncAutoAllTT(){
  syncBranco();
  const batoqueDefault = findStockByCategory('batoque');
  const tintaCount = activeConsumptions.filter(c=>c.kind==='tinta' && c.stockId).length;
  const needed = tintaCount + (activeBranco?1:0);
  if(batoqueDefault){
    let autoIdx = activeConsumptions.map((c,i)=>({c,i})).filter(x=>x.c.kind==='batoque-auto').map(x=>x.i);
    while(autoIdx.length < needed){ activeConsumptions.push({stockId:batoqueDefault.id, qty:1, kind:'batoque-auto'}); autoIdx.push(activeConsumptions.length-1); }
    while(autoIdx.length > needed){ activeConsumptions.splice(autoIdx.pop(),1); }
  }
  activeConsumptions = activeConsumptions.filter(c=>c.kind!=='vitalderm');
  const vd = findStockByCategory('vitalderm');
  if(vd && activeVitaldermCm>0) activeConsumptions.push({stockId:vd.id, qty:round2(activeVitaldermCm/100), kind:'vitalderm'});
}

const LOCAL_CORPO_OPTIONS = ['Antebraço','Braço','Ombro','Perna','Coxa','Panturrilha','Costas','Peito','Costela','Mão','Pé','Pescoço','Outro'];

const TAMANHO_OPTIONS = ['Pequena (até 8cm)','Média (8–18cm)','Grande (18–28cm)','Extra grande (28cm+)'];

}
const DIFICULDADE_OPTIONS = ['Simples','Moderada','Complexa','Muito complexa'];
function dificuldadeOptionsHtml(selected){
  return `<option value="">Selecionar…</option>` + DIFICULDADE_OPTIONS.map(o=>`<option value="${o}" ${o===selected?'selected':''}>${o}</option>`).join('');
}
const ORCAMENTO_BASE = {'Pequena (até 8cm)':150, 'Média (8–18cm)':350, 'Grande (18–28cm)':550, 'Extra grande (28cm+)':750};
const ORCAMENTO_MINIMO = 150;
const ORCAMENTO_DIFICULDADE_PCT_DEFAULT = {'Simples':0, 'Moderada':15, 'Complexa':30, 'Muito complexa':50};
const ORCAMENTO_LOCAL_PCT_DEFAULT = {'Antebraço':0,'Braço':0,'Ombro':0,'Perna':0,'Coxa':0,'Panturrilha':5,'Costas':0,'Peito':10,'Costela':20,'Mão':25,'Pé':20,'Pescoço':15,'Outro':0};
function getOrcamentoConfig(){
  const saved = state.settings.find(s=>s.id==='orcamentoConfig') || {};
  return {
    dificuldadePct: {...ORCAMENTO_DIFICULDADE_PCT_DEFAULT, ...(saved.dificuldadePct||{})},
    localPct: {...ORCAMENTO_LOCAL_PCT_DEFAULT, ...(saved.localPct||{})},
  };
}
function collectOrcamentoSamples(){
  const fromAgenda = state.agenda.filter(a=>a.tamanho && a.dificuldade && (a.value>0) && !a.condicaoEspecial).map(a=>({tamanho:a.tamanho, dificuldade:a.dificuldade, localCorpo:a.localCorpo||'', value:a.value}));
  const fromTattoos = state.tattoos.filter(t=>t.tamanho && t.dificuldade && (t.value>0) && !t.condicaoEspecial && t.type!=='Flash').map(t=>({tamanho:t.tamanho, dificuldade:t.dificuldade, localCorpo:t.localCorpo||'', value:t.value}));
  return [...fromAgenda, ...fromTattoos];
}
function estimateOrcamento(tamanho, dificuldade, localCorpo){
  const cfg = getOrcamentoConfig();
  const base = ORCAMENTO_BASE[tamanho] || ORCAMENTO_MINIMO;
  const dPct = cfg.dificuldadePct[dificuldade] || 0;
  const lPct = localCorpo ? (cfg.localPct[localCorpo]||0) : 0;
  const formulaValue = Math.round(base * (1 + (dPct+lPct)/100));

  const samples = collectOrcamentoSamples();
  const tiers = [
    {basis:'tamanho, dificuldade e local iguais', list: samples.filter(s=>s.tamanho===tamanho && s.dificuldade===dificuldade && localCorpo && s.localCorpo===localCorpo)},
    {basis:'mesmo tamanho e dificuldade', list: samples.filter(s=>s.tamanho===tamanho && s.dificuldade===dificuldade)},
    {basis:'mesmo tamanho', list: samples.filter(s=>s.tamanho===tamanho)},
  ];
  let hist = null;
  for(const tier of tiers){
    if(tier.list.length>0){
      const values = tier.list.map(s=>s.value);
      hist = {value: values.reduce((s,v)=>s+v,0)/values.length, count: values.length, min:Math.min(...values), max:Math.max(...values), basis: tier.basis};
      break;
    }
  }
  let value = hist ? Math.round(formulaValue*0.5 + hist.value*0.5) : formulaValue;
  value = Math.max(ORCAMENTO_MINIMO, value);
  return {value, formulaValue, hist, base, dPct, lPct};
}

      <div style="font-family:var(--font-mono);font-size:30px;font-weight:600;margin:4px 0;">${brl(est.value)}</div>

function formatDateBR(iso){
  if(!iso) return '';
  const parts = iso.split('-');
  if(parts.length!==3) return '';
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}
function parseDateBR(str, fallbackISO){
  const m = (str||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return fallbackISO;
  return `${m[3]}-${m[2]}-${m[1]}`;
}

function formatDuration(hhmm){
  const mm = /^(\d{1,2}):(\d{2})$/.exec(hhmm||'');
  const h = mm?parseInt(mm[1],10):0, m = mm?parseInt(mm[2],10):0;
  if(h>0 && m>0) return `${h}h ${m}min`;
  if(h>0) return `${h}h`;
  return `${m}min`;
}
function parseDuracaoToHHMM(text){
  if(!text) return '00:15';
  const hMatch = text.match(/(\d+)\s*h/i);
  const mMatch = text.match(/(\d+)\s*m/i);
  let h = hMatch?parseInt(hMatch[1],10):0;
  let m = mMatch?parseInt(mMatch[1],10):0;
  if(!hMatch && !mMatch){
    const num = text.match(/(\d+)/);
    if(num) m = parseInt(num[1],10);
  }
  return `${String(Math.min(23,h)).padStart(2,'0')}:${String(Math.min(59,m)).padStart(2,'0')}`;
}

const CAL_MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function openDatePicker(currentISO, onPick){

function renderCalPicker(){
  const {year, month, selectedISO} = calPickerState;
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayIso = todayISO();
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = [iso===selectedISO?'sel':'', iso===todayIso?'today':''].filter(Boolean).join(' ');
    cells += `<button type="button" class="cal-cell ${cls}" data-iso="${iso}">${d}</button>`;
  }
  document.getElementById('calPickerBody').innerHTML = `
    <div class="cal-nav">
      <button type="button" class="icon-btn" id="calPrev">${ICONS.chevL}</button>
      <span class="cal-month-label">${CAL_MONTH_NAMES[month]} ${year}</span>
      <button type="button" class="icon-btn" id="calNext">${ICONS.chevR}</button>
    </div>
    <div class="cal-grid cal-weekdays"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>
    <div class="cal-grid">${cells}</div>
    <button type="button" class="btn secondary block" id="calToday" style="margin-top:14px;">Hoje</button>
  `;
  document.getElementById('calPrev').onclick = ()=>{ calPickerState.month--; if(calPickerState.month<0){calPickerState.month=11; calPickerState.year--;} renderCalPicker(); };
  document.getElementById('calNext').onclick = ()=>{ calPickerState.month++; if(calPickerState.month>11){calPickerState.month=0; calPickerState.year++;} renderCalPicker(); };
  document.getElementById('calToday').onclick = ()=>{ const t=todayISO(); calPickerState.onPick(t); closePicker(); };
  document.querySelectorAll('.cal-cell[data-iso]').forEach(btn=>{
    btn.onclick = ()=>{ calPickerState.onPick(btn.dataset.iso); closePicker(); };

const TIME_WHEEL_ITEM_H = 40;
function openTimePicker(currentHHMM, onPick, title){
  const m = /^(\d{1,2}):(\d{2})$/.exec(currentHHMM||'');
  const hh = m ? Math.min(23, parseInt(m[1],10)) : 0;
  const mm = m ? Math.min(59, parseInt(m[2],10)) : 0;
  openPicker(title || 'Selecionar horário', `
    <div class="time-wheel-wrap">
      <div class="time-wheel-highlight"></div>
      <div class="time-wheel" id="wheelHours"><div class="time-wheel-spacer"></div>${Array.from({length:24},(_,i)=>`<div class="time-wheel-item" data-v="${i}">${String(i).padStart(2,'0')}</div>`).join('')}<div class="time-wheel-spacer"></div></div>
      <div class="time-wheel-sep">:</div>
      <div class="time-wheel" id="wheelMinutes"><div class="time-wheel-spacer"></div>${Array.from({length:60},(_,i)=>`<div class="time-wheel-item" data-v="${i}">${String(i).padStart(2,'0')}</div>`).join('')}<div class="time-wheel-spacer"></div></div>
    </div>
    <button type="button" class="btn block" id="timeConfirm" style="margin-top:16px;">Confirmar</button>
  `);
  const hEl = document.getElementById('wheelHours'), mEl = document.getElementById('wheelMinutes');
  hEl.scrollTop = hh*TIME_WHEEL_ITEM_H;
  mEl.scrollTop = mm*TIME_WHEEL_ITEM_H;
  document.getElementById('timeConfirm').onclick = ()=>{
    const h = Math.max(0, Math.min(23, Math.round(hEl.scrollTop/TIME_WHEEL_ITEM_H)));
    const mi = Math.max(0, Math.min(59, Math.round(mEl.scrollTop/TIME_WHEEL_ITEM_H)));
    onPick(`${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`);
    closePicker();
  };
}

      cons = cons.filter(c=> !(white&&c.stockId===white.id) && !(copinho&&c.stockId===copinho.id) && !(solid&&c.stockId===solid.id));
    }
    const vLine = vitalderm && cons.find(c=>c.stockId===vitalderm.id);
    if(vLine){ activeVitaldermCm = round2(vLine.qty*100); cons = cons.filter(c=>c!==vLine); }
    activeConsumptions = cons.map(c=>{
      const it = state.stock.find(s=>s.id===c.stockId);
      let kind = 'other';
      if(it && it.category==='cartucho') kind='cartucho';
      else if(it && it.category==='tinta') kind='tinta';
      else if(it && it.category==='batoque') return null;
      return {stockId:c.stockId, qty:c.qty, kind};
    }).filter(Boolean);
  } else {
    activeConsumptions = [];
  }
  const today = todayISO();
  const initialType = existing ? (existing.type||'Autoral') : 'Autoral';
  openModal(existing?'Editar tattoo':'Registrar tattoo', `

      <div class="field-row">
        <div class="field" id="clientFieldWrap"><label>Cliente / identificação (opcional)</label><input name="client" value="${existing?escapeHtml(existing.client||''):(prefill?escapeHtml(prefill.client||''):'')}" placeholder="Nome do cliente" /></div>

        <label>Tipo</label>
        <div class="type-picker" id="typePicker">
          ${['Autoral','Flash','Cover','Outro'].map(t=>`<button type="button" class="type-opt ${t===initialType?'active':''}" data-type="${t}">${t}</button>`).join('')}
        </div>
      </div>
      <input type="hidden" name="type" value="${initialType}" />
      <div class="field"><label>Valor</label><input name="value" type="number" step="0.01" min="0" value="${existing?existing.value:(prefill?prefill.value||'':'')}" required /></div>
      <label class="check-card" for="ttPago">
        <input type="checkbox" id="ttPago" name="pago" ${existing?(isPago(existing)?'checked':''):'checked'} />
        <div>
          <div class="check-title">Pago</div>
          <div class="check-sub">Desmarque se o cliente ainda não pagou</div>
        </div>
      </label>
      ${materialsSectionHtml()}
      <div class="field-row">
        ${durationFieldHtml('duracaoHHMM', existing?parseDuracaoToHHMM(existing.duracao):'00:15', 'Duração')}
        <div class="field"><label>Local do corpo</label><select name="localCorpo">${localCorpoOptionsHtml(existing?existing.localCorpo:(prefill?prefill.localCorpo:''))}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Tamanho</label><select name="tamanho">${tamanhoOptionsHtml(existing?existing.tamanho:(prefill?prefill.tamanho:''))}</select></div>
        <div class="field"><label>Dificuldade</label><select name="dificuldade">${dificuldadeOptionsHtml(existing?existing.dificuldade:(prefill?prefill.dificuldade:''))}</select></div>
      </div>
      <label class="check-card" for="ttCondicaoEspecial">
        <input type="checkbox" id="ttCondicaoEspecial" name="condicaoEspecial" ${(existing&&existing.condicaoEspecial)||(prefill&&prefill.condicaoEspecial)?'checked':''} />
        <div>
          <div class="check-title">Condição especial</div>
          <div class="check-sub">Preço combinado (amigo, família, permuta...) — não entra no cálculo de orçamento</div>
        </div>
      </label>
      <div class="field" id="notesFieldWrap"><label>Observações</label><textarea name="notes" placeholder="Tamanho, complexidade, reação de pele, ajustes...">${existing?escapeHtml(existing.notes||''):''}</textarea></div>
      <button type="submit" class="btn block">${existing?'Salvar alterações':'Registrar tattoo'}</button>
    </form>
  `);
  applyFlashSimplification(initialType==='Flash');
  wireDateTimeFields(document.getElementById('tattooForm'));
  wireMaterialsSection();
  document.getElementById('typePicker').querySelectorAll('.type-opt').forEach(btn=>{
    btn.onclick = ()=>{
      document.getElementById('typePicker').querySelectorAll('.type-opt').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector('#tattooForm input[name="type"]').value = btn.dataset.type;
      applyFlashSimplification(btn.dataset.type==='Flash');
      if(btn.dataset.type==='Flash'){
        const form = document.getElementById('tattooForm');
        if(!form.elements.value.value) form.elements.value.value = 120;
      }
    };
  });
  document.getElementById('tattooForm').onsubmit = async (e)=>{
    e.preventDefault();
    const f = e.target;
    const submitBtn = f.querySelector('button[type="submit"]');
    if(submitBtn.disabled) return;
    submitBtn.disabled = true;
    const consumptions = buildConsumptionSnapshot(activeConsumptions);
    const costTotal = round2(consumptionsCost(consumptions));
    const isFlash = f.elements.type.value==='Flash';
    const value = parseFloat(f.elements.value.value)||0;
    const data = {
      client: isFlash?'':f.elements.client.value.trim(), date: f.elements.dateBR.value || today, type: f.elements.type.value,
      value, pago: f.elements.pago.checked,
      instagram: existing?(existing.instagram||''):'', duracao: formatDuration(f.elements.duracaoHHMM.value), localCorpo: f.elements.localCorpo.value,
      tamanho: f.elements.tamanho.value, dificuldade: f.elements.dificuldade.value,
      condicaoEspecial: f.elements.condicaoEspecial.checked,
      notes: isFlash?'':f.elements.notes.value.trim(), consumptions, costTotal,
      eventId: eventId, flashId: flashId,
    };
    if(existing){
      await revertConsumptions(existing.consumptions||[]);
      await applyConsumptions(consumptions);
      await colUpdate('tattoos', existing.id, data);
      closeModal();
      return;
    }
    data.createdAt = new Date().toISOString();
    await applyConsumptions(consumptions);
    const {id} = await colAdd('tattoos', data);
    if(flashId) await colUpdate('flashes', flashId, {status:'sold', tattooId:id});
    if(agendaId){
      await colDelete('agenda', agendaId);
      closeModal();
      activeTab = 'tattoos';
      renderApp();
      return;
    }
    closeModal();
  };
}

function flashRapidaAutoKitLines(){
  const vitalderm = findStockByCategory('vitalderm');
  const mimo = getMimoItem();
  const batoque = findStockByCategory('batoque');
  const numBatoques = flashRapidaTintas.filter(t=>t.stockId).length + (flashRapidaBranco?1:0);
  const lines = [];
  if(batoque && numBatoques>0) lines.push({item:batoque, qty:numBatoques});
  if(vitalderm) lines.push({item:vitalderm, qty:0.05});
  if(mimo) lines.push({item:mimo, qty:1});
  if(flashRapidaBranco){
    const white = findWhiteTinta(); const copinho = findCopinho();
    if(white) lines.push({item:white, qty:0.5});
    if(copinho) lines.push({item:copinho, qty:1});
  }
  const filmeP = findPlasticoFilme('P'); if(filmeP) lines.push({item:filmeP, qty:0.2});
  const gilete = findStockByCategory('gilete'); if(gilete) lines.push({item:gilete, qty:1});
  const lenco = findPapel('Lenço'); if(lenco) lines.push({item:lenco, qty:5});
  const sabonete = findStockByCategory('sabonete'); if(sabonete) lines.push({item:sabonete, qty:3});
  const papelVegetal = findPapel('Papel vegetal'); if(papelVegetal) lines.push({item:papelVegetal, qty:round4(1/24)});
  return lines;
}

  const el = document.getElementById('frKitPreview');

}

    flashRapidaTintas.filter(t=>t.stockId).forEach(t=>consumptions.push({stockId:t.stockId, qty:0.5}));
    flashRapidaAutoKitLines().forEach(l=>consumptions.push({stockId:l.item.id, qty:l.qty}));

      flashSize: flashRapidaSize,
      notes:'', consumptions:snapshot, costTotal, eventId, flashId:null, createdAt:new Date().toISOString(),
    };
    await applyConsumptions(snapshot);
    await colAdd('tattoos', data);

/* ---- stock form (Tipo-driven) ---- */
function stockFormExtrasHtml(tipoKey, values){
  const tipo = TIPOS[tipoKey];
  if(!tipo || !tipo.extraFields.length) return '';
  return tipo.extraFields.map(f=>{
    if(f.select){
      return `<div class="field"><label>${f.label}</label><select name="ef_${f.key}">
        ${f.select.map(opt=>`<option value="${opt}" ${values[f.key]===opt?'selected':''}>${opt}</option>`).join('')}
      </select></div>`;

    }
    const type = f.numeric ? 'number' : 'text';
    const val = values[f.key]!==undefined && values[f.key]!==null ? values[f.key] : (f.numeric && f.default!==undefined ? f.default : '');
    return `<div class="field"><label>${f.label}</label><input name="ef_${f.key}" type="${type}" ${f.numeric?'step="0.01"':''} value="${escapeHtml(val)}" placeholder="${f.placeholder||''}" /></div>`;
  }).join('');
}
function stockFormUnitHtml(tipoKey, currentUnit){
  const tipo = TIPOS[tipoKey];
  if(tipo.unitChoices){
    return `<label>Unidade</label><select name="unit">${tipo.unitChoices.map(u=>`<option value="${u}" ${(currentUnit||tipo.unit)===u?'selected':''}>${UNIT_LABELS[u]||u}</option>`).join('')}</select>`;
  }
  return `<label>Unidade</label><input type="text" value="${UNIT_LABELS[tipo.unit]||tipo.unit} (fixa)" disabled />`;
}
function refreshStockFormDynamic(tipoKey, item){
  const tipo = TIPOS[tipoKey];
  document.getElementById('tipoExtraFields').innerHTML = stockFormExtrasHtml(tipoKey, item||{});
  document.getElementById('unitFieldWrap').innerHTML = stockFormUnitHtml(tipoKey, item?item.unit:null);
  const hintEl = document.getElementById('tipoHint');
  hintEl.textContent = tipo.hint || '';
  const minEl = document.querySelector('#stockForm [name="minStock"]');
  if(minEl && !item && tipo.defaultMinStock!==undefined && !minEl.dataset.touched){
    minEl.value = tipo.defaultMinStock;
  }
  if(tipo.computeQuantity){
    const extrasContainer = document.getElementById('tipoExtraFields');
    const recompute = ()=>{
      const values = {};
      tipo.extraFields.forEach(fld=>{ const el=extrasContainer.querySelector(`[name="ef_${fld.key}"]`); if(el) values[fld.key] = fld.numeric ? (parseFloat(el.value)||0) : el.value.trim(); });
      const computed = tipo.computeQuantity(values);
      if(computed!==null && computed!==undefined){
        const qtyEl = document.querySelector('#stockForm [name="quantity"]');
        if(qtyEl) qtyEl.value = computed;
      }
    };
    extrasContainer.addEventListener('input', recompute);
    extrasContainer.addEventListener('change', recompute);
  }
  const minLabel = document.getElementById('minStockLabel');
  const groupHintEl = document.getElementById('minStockGroupHint');
  if(tipoKey==='cartucho'){
    const extrasContainer = document.getElementById('tipoExtraFields');
    const updateCartuchoHint = ()=>{
      const numEl = extrasContainer.querySelector('[name="ef_numeracao"]');
      const cfgEl = extrasContainer.querySelector('[name="ef_configuracao"]');
      const key = `${(numEl?numEl.value:'').trim()}${(cfgEl?cfgEl.value:'').trim()}`.toUpperCase();
      if(minLabel) minLabel.textContent = 'Estoque mínimo da configuração' + (key?` (${key})`:'');
      if(!key){ if(groupHintEl) groupHintEl.textContent = 'Vale pra todas as marcas com essa numeração + configuração — não precisa ser a mesma marca.'; return; }
      const otherItems = cartuchoGroupItems(key).filter(s=>!item || s.id!==item.id);
      const groupMin = cartuchoGroupMin(key);
      const minEl = document.querySelector('#stockForm [name="minStock"]');
      if(minEl && !minEl.dataset.touched && otherItems.length){ minEl.value = groupMin; }
      if(groupHintEl){
        groupHintEl.textContent = otherItems.length
          ? `Vale pra todas as marcas ${key} — já tem ${otherItems.length} marca${otherItems.length>1?'s':''} com ${cartuchoGroupTotal(key)} un no total nessa configuração.`
          : `Vale pra todas as marcas com essa numeração + configuração — não precisa ser a mesma marca.`;
      }
    };
    extrasContainer.addEventListener('input', updateCartuchoHint);
    updateCartuchoHint();
    const minElTouch = document.querySelector('#stockForm [name="minStock"]');
    if(minElTouch) minElTouch.addEventListener('input', e=>{ e.target.dataset.touched='1'; });
  } else {
    if(minLabel) minLabel.textContent = 'Estoque mínimo';
    if(groupHintEl) groupHintEl.textContent = '';
  }
}

        <div class="field" id="minStockFieldWrap"><label id="minStockLabel">Estoque mínimo</label><input name="minStock" type="number" step="0.01" min="0" value="" /></div>
      </div>`}
      ${item? `<div class="field" id="minStockFieldWrap"><label id="minStockLabel">Estoque mínimo</label><input name="minStock" type="number" step="0.01" min="0" value="${item.minStock}" /></div>` : ''}
      <div id="minStockGroupHint" class="hint"></div>

      <label class="check-card" for="stockCartaoPessoal">
        <input type="checkbox" id="stockCartaoPessoal" name="cartaoPessoal" />
        <div>
          <div class="check-title">Paguei com meu cartão pessoal</div>

        </div>
      </label>
      <div id="stockCartaoFormaWrap" style="display:none;">
        ${formaPagamentoHtml('stockCartao')}
        <div id="stockCartaoVencimentoWrap">${dateFieldHtml('cartaoVencimentoBR', todayISO(), 'Data que vou pagar no cartão')}</div>
      </div>
      <button type="submit" class="btn block">${item?'Salvar alterações':'Adicionar ao estoque'}</button>
    </form>`);
  refreshStockFormDynamic(initialTipo, item);
  if(prefillName && !item){
    const descEl = document.querySelector('#stockForm [name="ef_descricao"]');
    if(descEl) descEl.value = prefillName;
  }
  document.getElementById('tipoSelect').onchange = (e)=>{ refreshStockFormDynamic(e.target.value, null); };
  document.querySelector('#stockForm [name="minStock"]').addEventListener('input', e=>{ e.target.dataset.touched='1'; });
  wireDateTimeFields(document.getElementById('stockForm'));
  const getStockForma = wireFormaPagamento('stockCartao', 'stockCartaoVencimentoWrap');
  document.getElementById('stockCartaoPessoal').onchange = e=>{
    document.getElementById('stockCartaoFormaWrap').style.display = e.target.checked ? '' : 'none';
  };

  document.getElementById('stockForm').onsubmit = async (e)=>{
    e.preventDefault(); const f=e.target;
    const tipoKey = f.elements.tipo.value;
    const tipo = TIPOS[tipoKey];
    const extraValues = {};
    tipo.extraFields.forEach(fld=>{ if(fld.transient) return; const el=f.elements['ef_'+fld.key]; if(el) extraValues[fld.key] = fld.numeric ? (parseFloat(el.value)||0) : el.value.trim(); });
    let unit = tipo.unitChoices ? f.elements.unit.value : tipo.unit;
    const custoTotalPago = parseFloat(f.elements.custoTotalPago.value)||0;
    let minStock = parseFloat(f.elements.minStock.value)||0;
    const name = tipo.nameFn(extraValues);

    if(item){
      let quantityBought = parseFloat(f.elements.quantityBought.value)||0;
      let quantityHave = parseFloat(f.elements.quantity.value)||0;
      if(tipoKey==='sabonete' && unit==='L'){ quantityBought = round2(quantityBought*1000); quantityHave = round2(quantityHave*1000); minStock = round2(minStock*1000); unit='ml'; }
      const costPerUnit = quantityBought>0 ? round4(custoTotalPago/quantityBought) : 0;
      await colUpdate('stock', item.id, {name, category:tipoKey, unit, ...extraValues, quantity:quantityHave, costPerUnit, minStock});
      if(tipoKey==='cartucho') await syncCartuchoGroupMin(cartuchoGroupKey(extraValues), minStock, item.id);
      await logCompra(name, tipoKey, quantityBought, unit, custoTotalPago);
      if(f.elements.cartaoPessoal.checked) await addReembolso(name, custoTotalPago, 'estoque', f.elements.cartaoVencimentoBR.value, getStockForma());
      if(f.dataset.shoppingId) await colUpdate('shopping', f.dataset.shoppingId, {done:true});
      closeModal(); return;
    }
    let quantity = parseFloat(f.elements.quantity.value)||0;
    if(tipoKey==='sabonete' && unit==='L'){ quantity = round2(quantity*1000); minStock = round2(minStock*1000); unit='ml'; }
    const costPerUnit = quantity>0 ? round4(custoTotalPago/quantity) : 0;
    const data = {name, category:tipoKey, unit, ...extraValues};
    const existing = state.stock.find(s=> s.category===tipoKey && (s.name||'').toLowerCase()===name.toLowerCase());
    if(existing){
      const oldQty = existing.quantity||0, oldCost = existing.costPerUnit||0;
      const newQty = round2(oldQty+quantity);
      const newCost = newQty>0 ? round4(((oldQty*oldCost)+(quantity*costPerUnit))/newQty) : costPerUnit;
      const finalMin = minStock||existing.minStock;
      await colUpdate('stock', existing.id, {quantity:newQty, costPerUnit:newCost, minStock: finalMin});
      if(tipoKey==='cartucho') await syncCartuchoGroupMin(cartuchoGroupKey(extraValues), finalMin, existing.id);
    } else {
      const {id:newId} = await colAdd('stock', {...data, quantity, costPerUnit, minStock, createdAt:new Date().toISOString()});
      if(tipoKey==='cartucho') await syncCartuchoGroupMin(cartuchoGroupKey(extraValues), minStock, newId);
    }
    await logCompra(name, tipoKey, quantity, unit, custoTotalPago);
    if(f.elements.cartaoPessoal.checked) await addReembolso(name, custoTotalPago, 'estoque', f.elements.cartaoVencimentoBR.value, getStockForma());
    if(f.dataset.shoppingId) await colUpdate('shopping', f.dataset.shoppingId, {done:true});
    closeModal();
  };
}

    }

  };

let activeRecipe = [];
function recipeUnitLabel(item){ return item ? (item.category==='pomada' ? 'g' : (UNIT_LABELS[item.unit]||item.unit)) : ''; }
function recipeLineNativeQty(item, qty){
  if(!item) return 0;
  if(item.category==='pomada'){ const gpu = Number(item.gramsPerUnit)||1; return qty/gpu; }
  return qty;
}
function recipeLineCost(item, qty){
  if(!item) return 0;
  return recipeLineNativeQty(item, qty) * (item.costPerUnit||0);
}
function renderRecipeRows(){
  const container = document.getElementById('recipeRows');
  if(!container) return;
  const nonMimoStock = state.stock.filter(s=>s.category!==MIMO_CATEGORY);

    const item = nonMimoStock.find(s=>s.id===r.stockId);

      <input type="number" step="0.01" min="0" data-ridx="${i}" data-role="rqty" value="${r.qty||''}" placeholder="qtd" />

  }).join('');
  const totalCost = activeRecipe.reduce((s,r)=>{ const item=nonMimoStock.find(x=>x.id===r.stockId); return s+recipeLineCost(item, r.qty||0); },0);
  container.innerHTML = rowsHtml + `<div class="cost-preview"><span>Custo estimado por Mimo</span><b>${brl(totalCost)}</b></div>`;

}

function openProduceMimoForm(){
  const mimo = getMimoItem();
  if(!mimo || !mimo.recipe || !mimo.recipe.length){ openMimoRecipeForm(); return; }
  const preview = mimo.recipe.map(r=>{
    const item = state.stock.find(s=>s.id===r.stockId);
    return `<div class="row-sub">${item?escapeHtml(item.name):'item removido'} — ${r.qty} ${item?recipeUnitLabel(item):''} por mimo${item?` (${item.quantity} ${UNIT_LABELS[item.unit]||item.unit} em estoque)`:''}</div>`;
  }).join('');
  openModal('Produzir Mimo pronto', `
    <form id="produceMimoForm">
      <div class="field"><label>Quantidade a produzir</label><input name="qty" type="number" step="1" min="1" value="1" required /></div>
      <div class="field"><label>Composição usada por mimo</label>${preview}</div>
      <button type="submit" class="btn block">Produzir e descontar do estoque</button>
    </form>`);
  document.getElementById('produceMimoForm').onsubmit = async (e)=>{
    e.preventDefault(); const f=e.target;
    const producedQty = parseFloat(f.elements.qty.value)||0;
    if(producedQty<=0){ closeModal(); return; }
    let batchCost = 0;
    for(const r of mimo.recipe){
      const item = state.stock.find(s=>s.id===r.stockId);
      if(!item) continue;
      const nativeQtyTotal = recipeLineNativeQty(item, r.qty) * producedQty;
      batchCost += nativeQtyTotal * (item.costPerUnit||0);
      await adjustStock(item.id, -Math.abs(nativeQtyTotal));
    }
    const unitCostThisBatch = producedQty>0 ? batchCost/producedQty : 0;
    const oldQty = mimo.quantity||0, oldCost = mimo.costPerUnit||0;
    const newQty = round2(oldQty+producedQty);
    const newCost = newQty>0 ? round2(((oldQty*oldCost)+(producedQty*unitCostThisBatch))/newQty) : unitCostThisBatch;
    await colUpdate('stock', mimo.id, {quantity:newQty, costPerUnit:newCost});
    closeModal();
  };
}

/* ---- shopping form ---- */
function openShoppingForm(id){
  const item = id ? state.shopping.find(x=>x.id===id) : null;
  openModal(item?'Editar item da lista':'Adicionar à lista de compras', `
    <form id="shoppingForm">
      <div class="field"><label>Item</label><input name="name" required placeholder="Ex.: Tinta Dynamic Black" value="${item?escapeHtml(item.name):''}" /></div>
      <div class="field-row">
        <div class="field"><label>Quantidade (opcional)</label><input name="qty" placeholder="Ex.: 2 potes" value="${item?escapeHtml(item.qty||''):''}" /></div>
        <div class="field"><label>Nota (opcional)</label><input name="note" placeholder="Ex.: loja X" value="${item?escapeHtml(item.note||''):''}" /></div>
      </div>
      <button type="submit" class="btn block">${item?'Salvar alterações':'Adicionar'}</button>
    </form>`);
  document.getElementById('shoppingForm').onsubmit = async (e)=>{
    e.preventDefault(); const f=e.target;
    const data = {name:f.elements.name.value.trim(), qty:f.elements.qty.value.trim(), note:f.elements.note.value.trim()};
    if(item) await colUpdate('shopping', item.id, data);
    else await colAdd('shopping', {...data, done:false, createdAt:new Date().toISOString()});
    closeModal();
  };
}
function toggleShopping(id){
  const s = state.shopping.find(x=>x.id===id);
  if(!s) return;
  colUpdate('shopping', id, {done: !s.done});
}
function confirmShoppingPurchase(id){
  const s = state.shopping.find(x=>x.id===id);
  if(!s) return;
  openStockForm(null, {shoppingId:id, prefillName:s.name});
}
function deleteShopping(id){ colDelete('shopping', id); }
async function addLowStockToShopping(){
  const low = lowStockItems();
  for(const item of low){
    const already = state.shopping.some(s=>!s.done && s.name===item.name);
    if(!already) await colAdd('shopping', {name:item.name, qty:'', note:'estoque baixo', done:false, createdAt:new Date().toISOString()});
  }
}

/* ============ THEME ============ */
function prefersDark(){
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
  catch(e){ return false; }
}
function initTheme(){
  try{
    const saved = localStorage.getItem('ftc-theme');
    if(saved) document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
  updateThemeIcon();
}
function updateThemeIcon(){
  const current = document.documentElement.getAttribute('data-theme');
  const isDark = current==='dark' || (!current && prefersDark());
  document.getElementById('themeToggle').innerHTML = isDark ? ICONS.sun : ICONS.moon;
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const current = document.documentElement.getAttribute('data-theme');
  const isDark = current==='dark' || (!current && prefersDark());
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('ftc-theme', next); }catch(e){}
  updateThemeIcon();
});

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  const doLogout = async ()=>{
    explicitLogout = true;
    if(supa){ try{ await supa.auth.signOut({scope:'local'}); }catch(e){ console.error(e); } }

  } else doLogout();
});
