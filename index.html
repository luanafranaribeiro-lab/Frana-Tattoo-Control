<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1FA; --card:#FFFFFF; --ink:#261B3A; --soft:#766C8E; --line:#E3DDEF; --well:#F1ECF8;
  --violet:#7B5CF0; --violet-bg:#ECE6FF; --rose:#F0598F; --mint:#22A57A; --mint-bg:#DDF4EA;
  --sun:#E4A91A; --sun-bg:#FCF1D4; --bad:#E0445E; --bad-bg:#FCE2E7;
  --hero:linear-gradient(135deg,#6B4BE8 0%,#A24FD8 55%,#EE5F93 100%);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15111F; --card:#201A2E; --ink:#F0ECF8; --soft:#A79DC0; --line:#342B48; --well:#2A2340;
  --violet:#A48BFF; --violet-bg:#2E2550; --rose:#FF7BA7; --mint:#4FD1A0; --mint-bg:#163428;
  --sun:#F2C050; --sun-bg:#3A2E12; --bad:#FF7A90; --bad-bg:#3E1C25;}}
:root[data-theme="dark"]{
  --paper:#15111F; --card:#201A2E; --ink:#F0ECF8; --soft:#A79DC0; --line:#342B48; --well:#2A2340;
  --violet:#A48BFF; --violet-bg:#2E2550; --rose:#FF7BA7; --mint:#4FD1A0; --mint-bg:#163428;
  --sun:#F2C050; --sun-bg:#3A2E12; --bad:#FF7A90; --bad-bg:#3E1C25;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:0 16px 120px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em}
h1{font-size:26px;font-weight:800}
h2{font-size:20px;font-weight:700;margin:28px 0 10px}
h3{font-size:16px;font-weight:700}
.muted{color:var(--soft);font-size:13px}
.num{font-variant-numeric:tabular-nums}
header.top{padding:20px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hdr-r{display:flex;align-items:center;gap:8px}
.save{font-size:12px;color:var(--soft);white-space:nowrap}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}

/* bottom nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bn .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.bn button{border:0;background:transparent;color:var(--soft);font:600 11px var(--body);padding:6px 2px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bn button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.bn button{position:relative;opacity:.55}
nav.bn button[aria-selected="true"]{color:var(--ink);opacity:1}
nav.bn button[aria-selected="true"] svg{stroke-width:2}
nav.bn button[aria-selected="true"]::after{content:"";position:absolute;top:0;left:50%;width:18px;height:3px;margin-left:-9px;border-radius:0 0 3px 3px;background:var(--violet)}

/* hero */
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero small{opacity:.85;font-size:14px}
.hero .big{font-family:var(--display);font-size:clamp(38px,11vw,52px);font-weight:800;line-height:1.05;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.hero .split{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.hero .split div{background:rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;font-size:13px}
.hero .split b{display:block;font-size:17px;font-family:var(--display)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;overflow:hidden}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;margin-bottom:8px}
.tile b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .sub2{font-size:12px;color:var(--soft);margin-top:4px}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 10px}
.monthnav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.monthnav b{font-family:var(--display);font-size:18px}

.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx div{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.item .val{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:var(--mint-bg);color:var(--mint)}.pill.warn{background:var(--sun-bg);color:var(--sun)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.btn{background:var(--violet);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:700 14px var(--body);cursor:pointer}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%;padding:13px}
.x{border:0;background:transparent;color:var(--soft);font-size:20px;cursor:pointer;border-radius:8px;padding:2px 6px}
.empty{color:var(--soft);font-size:14px;padding:6px 0}

/* donut + legend */
.donutbox{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.donutbox svg{width:150px;height:150px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1}

/* tattoo */
.tatcard{background:#261B3A;color:#fff;border-radius:22px;padding:18px;margin-top:4px;position:relative;overflow:hidden}
.tatcard::after{content:"";position:absolute;right:-50px;top:-50px;width:160px;height:160px;border-radius:50%;border:18px solid rgba(240,89,143,.25)}
.tatcard .tl{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px;position:relative;z-index:1}
.tatcard .muted2{font-weight:500;font-size:12px;opacity:.6}
.tatcard .tv{font-family:var(--display);font-size:clamp(34px,10vw,44px);font-weight:800;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.tatcard .tin{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tatcard .tin div{background:rgba(255,255,255,.09);border-radius:12px;padding:9px 12px}
.tatcard .tin small{opacity:.7;font-size:12px}
.tatcard .tin b{display:block;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.biz{border:0;border-radius:18px;padding:14px;text-align:left;cursor:pointer;color:#fff;font-family:var(--body);display:flex;flex-direction:column;gap:2px;min-height:110px}
.biz .bt{font-weight:700;font-size:14px;opacity:.95}
.biz b{font-family:var(--display);font-size:21px;margin-top:auto;font-variant-numeric:tabular-nums}
.biz small{font-size:12px;opacity:.8}
.tat{background:#261B3A}.tar{background:linear-gradient(140deg,#E4A91A,#F27A45);color:#2b1d00!important}
.bizbig{width:100%;border:0;border-radius:22px;padding:18px;text-align:left;cursor:pointer;color:#fff;font-family:var(--body);margin-bottom:12px;display:block}
.bizbig .tl{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.bizbig .tv,.tarhero .tv{font-family:var(--display);font-size:clamp(32px,9vw,42px);font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.bizbig .lbl{opacity:.7;font-size:12px}
.bizbig .tin,.tarhero .tin{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.bizbig .tin div,.tarhero .tin div{background:rgba(255,255,255,.12);border-radius:12px;padding:9px 12px}
.bizbig.tar .tin div,.tarhero .tin div{background:rgba(255,255,255,.28)}
.bizbig .tin small,.tarhero .tin small{opacity:.75;font-size:12px}
.bizbig .tin b,.tarhero .tin b{display:block;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.tarhero{background:linear-gradient(140deg,#E4A91A,#F27A45);color:#2b1d00;border-radius:22px;padding:18px}
.tarhero .tl{font-weight:700;font-size:15px}
.back{border:0;background:transparent;color:var(--violet);font:700 15px var(--body);padding:6px 0 10px;cursor:pointer}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:150px;align-items:end}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars i{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;min-height:3px}
.bars span{font-size:10px;color:var(--soft);white-space:nowrap}
.bars small{font-size:11px;color:var(--soft);text-transform:capitalize}
.paybtn{width:100%;margin-top:10px;display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--bad-bg);border-radius:18px;padding:14px;cursor:pointer;color:var(--ink);font-family:var(--body);text-align:left}
.paybtn .pi{width:40px;height:40px;border-radius:12px;background:var(--bad-bg);display:grid;place-items:center;font-size:19px}
.paybtn .pt{flex:1}.paybtn small{display:block;color:var(--soft);font-size:13px}
.paybtn b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.paybtn .pc{color:var(--bad);font-weight:700;font-size:14px;white-space:nowrap}
.inboxbtn{width:100%;display:flex;align-items:center;gap:12px;background:var(--violet-bg);color:var(--ink);border:1.5px solid var(--violet);border-radius:16px;padding:12px 14px;margin-bottom:12px;cursor:pointer;font-family:var(--body);text-align:left}
.inboxbtn>span:first-child{font-size:22px}.inboxbtn b{display:block;font-size:15px}.inboxbtn small{color:var(--soft);font-size:12px}
.parcbox{background:var(--well);border-radius:14px;padding:10px 12px}
.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.stepper b{font-family:var(--display);font-size:20px;min-width:40px;text-align:center}
.ajtop{display:flex;justify-content:space-between;align-items:center}
.ajmenu,.ajbtn{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;color:var(--ink);font-family:var(--body);text-align:left}
.ajmenu .ic{width:38px;height:38px;border-radius:12px;background:var(--well);display:grid;place-items:center;font-size:18px;flex:none}
.ajmenu .tx,.ajbtn .tx{flex:1;min-width:0}.ajmenu b,.ajbtn b{display:block;font-size:15px}
.ajmenu small,.ajbtn small{color:var(--soft);font-size:12px}
.chev{color:var(--soft);font-size:18px}
.ajrow{margin-top:8px}.ajrow .ajbtn{gap:10px}
.ajrow.on .ajbtn{border-color:var(--violet);border-bottom-left-radius:0;border-bottom-right-radius:0}
.ajed{border:1px solid var(--violet);border-top:0;border-radius:0 0 16px 16px;padding:6px 14px 14px;display:flex;flex-direction:column;gap:12px}
.del{border:0;background:transparent;color:var(--bad);font:600 14px var(--body);cursor:pointer;padding:4px 0;text-align:left}
.cdot{width:16px;height:16px;border-radius:50%}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.fmini{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;height:92px;align-items:end;margin:8px 0 12px}
.fmini button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;cursor:pointer;padding:0;border-radius:10px;color:var(--soft)}
.fmini i{width:70%;max-width:26px;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--line)}
.fmini span{font-size:9px;white-space:nowrap}
.fmini small{font-size:11px;font-weight:600;text-transform:capitalize}
.fmini button[aria-pressed="true"]{background:var(--violet-bg);color:var(--violet)}
.fmini button[aria-pressed="true"] small{color:var(--violet)}
.fcar{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.fcar::-webkit-scrollbar{display:none}
.fslide{flex:0 0 88%;scroll-snap-align:start}
.fslide .fat{margin:0;height:100%}
.fat.atual{border:1.5px solid var(--violet)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .2s}
.dots i.on{width:18px;border-radius:4px;background:var(--violet)}
.fxwarn{background:var(--sun-bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fxwarn b{font-size:14px}.fxwarn span{font-size:13px;color:var(--soft)}
.armed{color:#fff!important;background:var(--bad)!important;border-radius:10px;padding:6px 10px!important;font:700 13px var(--body)!important;border-color:var(--bad)!important}
.limite{margin-top:8px;border-radius:22px;padding:18px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#4B2F8F 0%,#261B3A 55%,#1C1430 100%);position:relative;overflow:hidden}
.limite .lt{display:flex;justify-content:space-between;align-items:center;gap:12px}
.limite small{font-size:12px;opacity:.7}
.limite .lv{font-family:var(--display);font-size:clamp(30px,9vw,38px);font-weight:800;line-height:1.1;margin:2px 0}
.limite svg{width:96px;height:96px;flex:none}
.lchips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.lchips div{background:rgba(255,255,255,.08);border-radius:12px;padding:9px 12px}
.lchips b{display:block;font-family:var(--display);font-size:16px}
.fmini i{background:var(--violet-bg)!important}
.fmini button.at i{background:var(--violet)!important}
.fmini button.pg i{background:var(--mint)!important}
.proj{background:linear-gradient(140deg,#2F95B8,#5B6CF0)}
.projhero{background:linear-gradient(140deg,#2F95B8,#5B6CF0);color:#fff;border-radius:22px;padding:18px}
.projhero .tl{font-weight:700;font-size:15px}
.projhero .tv{font-family:var(--display);font-size:clamp(32px,9vw,42px);font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.projhero .tin{display:grid;gap:8px;margin-top:12px}
.projhero .tin div{background:rgba(255,255,255,.16);border-radius:12px;padding:9px 12px}
.projhero .tin small{opacity:.8;font-size:12px}.projhero .tin b{display:block;font-family:var(--display);font-size:17px}
.tatbig{position:relative;overflow:hidden;width:100%;border:0;text-align:left;cursor:pointer;font-family:var(--body);color:#fff;border-radius:24px;padding:20px;margin-bottom:12px;
  background:linear-gradient(135deg,#FF5C9E 0%,#C04FD6 48%,#3E7BFF 100%);box-shadow:0 14px 34px rgba(90,70,220,.35),inset 0 0 0 1px rgba(255,255,255,.18)}
.tatbig .orn{position:absolute;right:-24px;top:-18px;width:210px;height:210px;color:#fff;opacity:.35;pointer-events:none}
.tatbig .tl{display:flex;justify-content:space-between;align-items:center;position:relative}
.tatbig .tag{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.tatbig .chev2{font-size:22px;opacity:.7}
.tatbig .lbl{display:block;margin-top:14px;font-size:12px;opacity:.85;position:relative}
.tatbig .tv{font-family:var(--display);font-size:clamp(36px,11vw,48px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;position:relative}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative}
.tstats div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px;backdrop-filter:blur(4px)}
.tstats small{display:block;font-size:11px;opacity:.85}
.tstats b{display:block;font-family:var(--display);font-size:16px;margin-top:2px;font-variant-numeric:tabular-nums}
.tstats .deve{background:rgba(255,255,255,.95);border-color:#fff;color:#3E2A8C}
.mbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--well);margin-top:14px}
.mbar div{height:100%}
.mleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--soft);margin-top:6px}
.mleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.tatchip[aria-pressed="false"]{border-color:#C04FD6;color:#C04FD6}
.tatnote{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#FF5C9E22,#3E7BFF22);border:1px solid #C04FD655;border-radius:16px;padding:12px 14px;margin-top:14px}
.tatnote>span{font-size:22px}.tatnote b{display:block;font-size:15px}.tatnote small{color:var(--soft);font-size:12px}
/* rings */
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ring{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.ring svg{width:92px;height:92px}
.ring b{display:block;font-family:var(--display);font-size:15px;margin-top:6px}

/* forms */
label.f{display:block;font-size:12px;color:var(--soft);font-weight:600;letter-spacing:.01em}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:2px;padding:8px 2px 9px;border:0;border-bottom:1.5px solid var(--line);border-radius:0;background:transparent;color:var(--ink);font:500 17px var(--body);transition:border-color .15s}
label.f input:focus,label.f select:focus{outline:none;border-bottom-color:var(--violet)}
label.f input::placeholder{color:var(--soft);opacity:.55}
button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.li input:focus,.li select:focus{outline:none;border-bottom-color:var(--violet)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bigval{font-family:var(--display)!important;font-size:38px!important;font-weight:800!important;text-align:center;border-bottom:0!important;padding:4px 0!important}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--c,var(--violet));background:var(--c,var(--violet));color:#fff}
.stack>*+*{margin-top:12px}

/* category cards */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.catcard{border-radius:18px;padding:14px;color:#fff;cursor:pointer;border:0;text-align:left;font-family:var(--body);position:relative;overflow:hidden}
.catcard .e{font-size:22px}
.catcard b{display:block;font-family:var(--display);font-size:22px;margin-top:6px;font-variant-numeric:tabular-nums}
.catcard small{opacity:.9;font-size:13px}
.catcard .share{position:absolute;left:0;bottom:0;height:5px;background:rgba(255,255,255,.55)}

/* bank cards */
.banks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bank{border-radius:20px;padding:16px;color:#fff;position:relative;overflow:hidden;min-height:120px}
.bank::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.bank .n{font-weight:700;font-size:14px;opacity:.95}
.bank .t{font-size:12px;opacity:.8}
.bank input{width:100%;margin-top:12px;background:transparent;border:0;border-bottom:1.5px solid rgba(255,255,255,.4);border-radius:0;outline:none;color:#fff;font:800 22px var(--display);padding:6px 10px;position:relative;z-index:1}
.bank input::placeholder{color:rgba(255,255,255,.7)}

/* faturas */
.fat{margin-bottom:12px}
.fat .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fat .tot{font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.sbar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--well);margin:12px 0 8px}
.sbar div{height:100%}
.klist{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.klist i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.klist span:nth-child(even){text-align:right}
details summary{cursor:pointer;color:var(--violet);font-weight:600;font-size:14px;margin-top:8px}

/* metas */
.meta .top2{display:flex;gap:14px;align-items:center}
.meta .top2 svg{width:84px;height:84px;flex:none}
.meta .nm{font-family:var(--display);font-size:18px;min-width:0;font-weight:700;border:0;background:transparent;color:var(--ink);padding:0;width:100%}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.facts div{background:var(--well);border-radius:12px;padding:9px 10px;font-size:12px;color:var(--soft)}
.facts b{display:block;font-family:var(--display);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.pbar{height:10px;background:var(--well);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.pbar div{height:100%;border-radius:6px}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(20,14,32,.5);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:24px}}
.li{display:grid;grid-template-columns:1fr 100px 36px;gap:8px;margin-bottom:8px}
.li.f3{grid-template-columns:1fr 90px 100px 36px}
.li input,.li select{padding:8px 2px;border:0;border-bottom:1.5px solid var(--line);border-radius:0;background:transparent;color:var(--ink);font:500 15px var(--body);width:100%;min-width:0}
.add{border:1.5px dashed var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:10px;width:100%;font:600 14px var(--body);cursor:pointer}
footer{margin-top:30px;font-size:12px;color:var(--soft);text-align:center}
@media (max-width:420px){
  .donutbox{grid-template-columns:1fr;justify-items:center}
  .legend{width:100%}
  .facts{grid-template-columns:1fr 1fr}
  .li.f3{grid-template-columns:1fr 90px 36px}.li.f3 select{grid-column:1/3;grid-row:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const SB_URL = "https://bwomclwfmenrhhmpwzom.supabase.co";
const SB_KEY = "sb_publishable_U1XxtSGN3BFkOrEoQSdyLQ_h6sLe-Vy";
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } }) : null;
let SB_USER = null;
const sbReadyCallbacks = [];
function onSbReady(fn){ if(SB_USER) fn(SB_USER); else sbReadyCallbacks.push(fn); }
async function sbSignOut(){ await sb.auth.signOut(); location.reload(); }
(function(){
  if(PREVIA){ SB_USER={id:'previa'}; return; }
  const box = document.getElementById('sbLogin');
  const form = document.getElementById('sbLoginForm');
  const err = document.getElementById('sbLoginErr');
  const em = document.getElementById('sbEmail'), pw = document.getElementById('sbSenha'), lemb = document.getElementById('sbLembrar');
  try{ const salvo = localStorage.getItem('fin-email'); if(salvo){ em.value = salvo; lemb.checked = true; } else if(localStorage.getItem('fin-lembrar')==='0'){ lemb.checked = false; } }catch(e){}
  document.getElementById('sbOlho').addEventListener('click', ()=>{
    const ver = pw.type === 'password'; pw.type = ver ? 'text' : 'password';
    document.getElementById('sbOlho').setAttribute('aria-label', ver ? 'Esconder senha' : 'Mostrar senha');
    document.getElementById('sbOlhoIc').innerHTML = ver
      ? '<path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'
      : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
  });
  /* sem "lembrar": a sessão acaba quando fechar o app */
  try{ if(localStorage.getItem('fin-lembrar')==='0' && !sessionStorage.getItem('fin-aberto')){ sb.auth.signOut({scope:'local'}); } sessionStorage.setItem('fin-aberto','1'); }catch(e){}
  function ready(user){
    if(SB_USER) return;
    SB_USER = user; box.style.display = 'none';
    sbReadyCallbacks.splice(0).forEach(fn=>fn(user));
  }
  form.addEventListener('submit', async e=>{
    e.preventDefault(); err.textContent = 'Entrando…';
    const { data, error } = await sb.auth.signInWithPassword({ email: document.getElementById('sbEmail').value.trim(), password: document.getElementById('sbSenha').value });
    if(error){ err.textContent = error.message.includes('Invalid') ? 'E-mail ou senha incorretos.' : 'Não deu pra entrar: ' + error.message; return; }
    try{ if(lemb.checked){ localStorage.setItem('fin-email', em.value.trim()); localStorage.setItem('fin-lembrar','1'); } else { localStorage.removeItem('fin-email'); localStorage.setItem('fin-lembrar','0'); } }catch(e){}
    err.textContent = ''; ready(data.user);
  });
  sb.auth.getSession().then(({ data })=>{
    if(data.session) ready(data.session.user); else box.style.display = 'flex';
  });
})();
</script>

function primeiraFatura(data){const [y,m,d]=(data||HOJE).split("-").map(Number);const fecha=+(S.cartao&&S.cartao.fecha)||28;return shiftM(y+"-"+String(m).padStart(2,"0"),d<=fecha?1:2)}
function parcelasNaFatura(k){
  const out=[];
  S.gastos.filter(g=>g.forma==="cartao").forEach(g=>{
    const n=Math.max(1,+g.parcelas||1), ini=primeiraFatura(g.data), cent=Math.round((+g.valor||0)*100), base=Math.floor(cent/n);
    for(let i=0;i<n;i++){ if(shiftM(ini,i)!==k)continue; const v=(i===n-1?cent-base*(n-1):base)/100; out.push({g,i:i+1,n,v}); }
  });
  return out;
}
function faturaDe(k){
  const parc=parcelasNaFatura(k);
  const compras=+S.fatura[k]||0, rec=sum(recorrCartao(),f=>f[1]), lanc=sum(parc,p=>p.v);
  return {compras,rec,lanc,parc,total:Math.round((compras+rec+lanc)*100)/100,paga:S.faturaPaga[k]};
}
const apFalta=a=>Math.max(0,Math.round(((+a.valor||0)-(+a.pagoValor||0))*100)/100);
const dividaPai=()=>S.aPagar.filter(a=>a.credor==="pai"&&!a.pago&&apFalta(a)>0.004).sort((x,y)=>(x.mes||"").localeCompare(y.mes||""));
function abaterPai(v,origem){let rest=Math.round(v*100)/100;const out=[];
  for(const a of dividaPai()){if(rest<=0.004)break;const f=apFalta(a),t=Math.min(rest,f);a.pagoValor=Math.round(((+a.pagoValor||0)+t)*100)/100;
    (a.abatimentos=a.abatimentos||[]).push({valor:t,data:HOJE,origem});if(apFalta(a)<=0.004)a.pago={via:"abatimento",data:HOJE};out.push({a,t});rest=Math.round((rest-t)*100)/100}
  return {out,rest}}
function planoPai(v){let rest=v;const out=[];for(const a of dividaPai()){if(rest<=0.004)break;const t=Math.min(rest,apFalta(a));out.push({a,t});rest-=t}return {out,rest:Math.round(rest*100)/100}}
function pendentes(k){
  const out=[];
  if(k<FAT_MESES[0])return out; /* o controle de contas começa em outubro/26 */
  S.fixos.filter(f=>f[2]!=="cartao").forEach(f=>{ if(!S.fixosPagos[k+"|"+f[0]]) out.push({tipo:"fixo",key:k+"|"+f[0],desc:f[0],valor:+f[1]||0,e:"📌"}); });
  S.aPagar.filter(a=>a.mes===k&&!a.pago&&apFalta(a)>0.004).forEach(a=>out.push({tipo:"conta",key:a.id,desc:a.desc+(+a.pagoValor>0?` (falta ${brl(apFalta(a))})`:""),valor:apFalta(a),e:a.credor==="pai"?"👨":"🔧"}));
  if(FAT_MESES.includes(k)){const fz=faturaDe(k); if(!fz.paga&&fz.total>0) out.push({tipo:"fatura",key:k,desc:"Fatura Sicredi",valor:fz.total,e:"💳"});}
  return out;
}

const saldoFisico=()=>sum(S.contas.filter(c=>c.tipo==="fisico"),c=>c.saldo);
const tatPago=r=>r.pagoValor!=null?+r.pagoValor:(r.reembolsado?+r.value:0);
const tatDeve=k=>sum(FR.reembolsos.filter(r=>(r.date||"").slice(0,7)===k),r=>Math.max(0,(+r.value||0)-tatPago(r)));
function tatSaldo(){
  const fat=sum(FR.tattoos.filter(t=>t.pago!==false),t=>t.value);
  const mat=sum(FR.tattoos,t=>t.costTotal);
  const ev=sum(FR.events,e=>sum(e.expenses||[],x=>x.value));
  const avul=sum(FR.reembolsos.filter(r=>r.origem==="manual"||r.origem===undefined),r=>r.value);
  return {fat,mat,ev,avul,saldo:Math.round((fat-mat-ev-avul)*100)/100};
}
const tatDeveTotal=()=>sum(FR.reembolsos,r=>Math.max(0,(+r.value||0)-tatPago(r)));
const tatRecebidoMes=k=>sum(FR.tattoos.filter(t=>(t.date||"").slice(0,7)===k),t=>t.received);
const tatRecebido=()=>sum(FR.tattoos,t=>t.received);
const gastosPessoais=k=>gastosMes(k).filter(g=>!ehTattoo(g));
function porCategoria(k){
  const m={}; gastosPessoais(k).forEach(g=>{m[g.cat||"Outros"]=(m[g.cat||"Outros"]||0)+(+g.valor||0)});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function metaInfo(m){
  const alvo=+m.alvo||0, tenho=+m.tenho||0, emp=+m.emprestado||0, n=+m.parcelas||0, vp=+m.valorParcela||0, pg=Math.min(+m.pagas||0,n);
  const totalFin=n*vp, juros=totalFin>0&&emp>0?totalFin-emp:0, restante=(n-pg)*vp;
  const disp=tenho+emp;                         /* o que eu tenho pra usar, com empréstimo */
  const pct=alvo>0?Math.min(1,disp/alvo):(n>0?pg/n:0);
  const pOwn=alvo>0?Math.min(1,tenho/alvo):0, pEmp=alvo>0?Math.max(0,Math.min(1,disp/alvo)-pOwn):0;
  return {alvo,tenho,emp,disp,n,vp,pg,totalFin,juros,restante,pct,pOwn,pEmp,falta:Math.max(0,alvo-disp)};
}

/* ================= VISUAIS ================= */
function donut(parts,size=150,th=22,center=""){
  const r=(size-th)/2, C=2*Math.PI*r, total=sum(parts,p=>p[1]);
  let off=0, segs="";
  if(total<=0) segs=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--well)" stroke-width="${th}"/>`;
  else parts.forEach(([c,v])=>{const L=v/total*C;segs+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="${th}" stroke-dasharray="${L} ${C-L}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=L;});
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true">${segs}${center}</svg>`;
}
/* anel com duas partes: dinheiro meu (cor cheia) + emprestado (mesma cor, clarinha) */
function ring2(x,color,size=92,th=10){
  if(!x.alvo)return ring(x.pct,color,size,th,x.n?Math.round(x.pct*100)+"%":"—");
  const r=(size-th)/2,C=2*Math.PI*r,a=x.pOwn*C,b=x.pEmp*C,c=size/2;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--well)" stroke-width="${th}"/>
  ${b>0.5?`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-opacity=".35" stroke-width="${th}" stroke-dasharray="${b} ${C}" stroke-dashoffset="${-a}" transform="rotate(-90 ${c} ${c})"/>`:""}
  ${a>0.5?`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${th}" stroke-linecap="round" stroke-dasharray="${a} ${C}" transform="rotate(-90 ${c} ${c})"/>`:""}
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="${size/4.6}" fill="var(--ink)">${Math.round(x.pct*100)}%</text></svg>`;
}
function ring(pct,color,size=92,th=10,label=""){
  const r=(size-th)/2,C=2*Math.PI*r,L=Math.max(0,Math.min(1,pct))*C;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--well)" stroke-width="${th}"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${th}" stroke-linecap="round" stroke-dasharray="${L} ${C}" ${L<0.5?'stroke-opacity="0"':""} transform="rotate(-90 ${size/2} ${size/2})"/>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="${size/4.6}" fill="var(--ink)">${label}</text></svg>`;
}

function render(){
  /* guarda o que estava aberto e o campo em foco, pra não perder ao redesenhar */
  const abertos=[...document.querySelectorAll("main details")].map(d=>d.open);
  const ae=document.activeElement; const foco=ae&&ae.closest&&ae.closest("main")&&ae.matches("input,select,textarea")?[...ae.attributes].filter(x=>x.name.startsWith("data-")&&x.name!=="data-prev").map(x=>`[${x.name}="${x.value}"]`).join(""):"";
  _render();
  document.querySelectorAll("main details").forEach((d,i)=>{if(abertos[i])d.open=true});
  if(foco){const el=document.querySelector("main "+foco);if(el&&el!==document.activeElement)el.focus()}

const normTx=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ");
function pareceFixo(x){
  const lugar=normTx(x.lugar);
  return S.fixos.find(f=>{
    const pal=normTx(f[0]).split(" ").filter(w=>w.length>=4);
    const nome=pal.some(w=>lugar.includes(w));

    return nome||(valor&&f[2]==="cartao");
  })||null;
}

function sincTatEntradas(){
  if(!FR.reembolsos.length&&!S.tatVisto)return false;
  const primeira=!S.tatVisto; S.tatVisto=S.tatVisto||{}; let mudou=primeira;
  for(const r of FR.reembolsos){
    const cur=Math.round(tatPago(r)*100)/100, seen=S.tatVisto[r.id];
    if(primeira||seen===undefined){S.tatVisto[r.id]=cur;mudou=true;continue}
    const d=Math.round((cur-seen)*100)/100; if(Math.abs(d)<0.01)continue;
    const c=conta(S.tatConta)?S.tatConta:S.contas[0].id;
    S.entradas.push({id:uid(),data:HOJE,desc:d>0?`Tattoo me pagou (Frana) · ${r.desc||""}`:`Ajuste: pagamento desfeito no Frana · ${r.desc||""}`,valor:d,conta:c,auto:true});
    mexeSaldo(c,d); S.tatVisto[r.id]=cur; mudou=true;
    if(d>0)setTimeout(()=>toast(`Tattoo pagou ${brl(d)} → ${conta(c)?.nome}`),300);
  }
  return mudou;
}
/* compra da tattoo -> reembolso pendente no Frana (uma linha por parcela, vencendo junto com a fatura) */
async function criarReembFrana(g){
  const n=Math.max(1,+g.parcelas||1), cent=Math.round((+g.valor||0)*100), base=Math.floor(cent/n), ini=g.forma==="cartao"?primeiraFatura(g.data):null;
  const linhas=[];
  for(let i=0;i<n;i++){
    const date=g.forma==="cartao"?shiftM(ini,i)+"-"+String(S.cartao.vence).padStart(2,"0"):g.data;
    linhas.push({id:"fin_"+g.id+(n>1?"_"+(i+1):""),data:{desc:(g.desc||"Compra da tattoo")+(n>1?` ${i+1}/${n}`:""),value:(i===n-1?cent-base*(n-1):base)/100,origem:"financas",aClassificar:true,
      gastoId:g.id,forma:g.forma==="cartao"?"credito":"debito",compraData:g.data,date,pagoValor:0,createdAt:new Date().toISOString()}});
  }
  (S.tatVisto=S.tatVisto||{}); linhas.forEach(l=>S.tatVisto[l.id]=0);
  if(PREVIA||!sb){linhas.forEach(l=>FR.reembolsos.push({id:l.id,...l.data}));try{localStorage.setItem("fin-previa-frana",JSON.stringify(FR))}catch(e){}render();return}
  const {error}=await sb.from("frana_docs").insert(linhas.map(l=>({user_id:SB_USER.id,col:"reembolsos",id:l.id,data:l.data})));
  if(error){console.error(error);toast("Não consegui mandar pro Frana");return}
  toast("Mandei pro Frana como reembolso");
}
async function apagarReembFrana(g){
  const ids=FR.reembolsos.filter(r=>r.gastoId===g.id&&!(tatPago(r)>0)).map(r=>r.id);
  FR.reembolsos=FR.reembolsos.filter(r=>!ids.includes(r.id));
  if(PREVIA||!sb){try{localStorage.setItem("fin-previa-frana",JSON.stringify(FR))}catch(e){}return}
  if(ids.length){const {error}=await sb.from("frana_docs").delete().eq("col","reembolsos").in("id",ids);if(error)console.error(error)}
}
async function aplicarPagTattoo(v,contaId){
  const p=planoAbate(v);

}

function mexeSaldo(id,delta){const c=conta(id);if(c)c.saldo=Math.round(((+c.saldo||0)+delta)*100)/100}
function pagar(t,k,v,contaId){
  if(t==="fatura")S.faturaPaga[k]={conta:contaId,valor:v,data:HOJE};
  else if(t==="fixo")S.fixosPagos[k]={conta:contaId,valor:v};
  else {const a=S.aPagar.find(x=>x.id===k);if(a){a.pagoValor=+a.valor||0;a.pago={conta:contaId,data:HOJE}}}
  mexeSaldo(contaId,-v);
}
function commit(){render();queueSave()}
/* confirmação sem pop-up (o navegador bloqueia confirm() dentro do app publicado):
   o primeiro toque arma o botão, o segundo confirma */
function confirma(btn,msg){
  if(btn.dataset.armed==="1"){delete btn.dataset.armed;return true}
  btn.dataset.armed="1"; btn.dataset.txt=btn.innerHTML;
  btn.classList.add("armed"); btn.innerHTML=btn.classList.contains("x")?"Apagar?":"Toca de novo pra confirmar";
  toast(msg);
  clearTimeout(btn._t); btn._t=setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.innerHTML=btn.dataset.txt;btn.classList.remove("armed")}},3500);
  return false;
}

/* ===== máscara de dinheiro: digita só números, vírgula e ponto entram sozinhos ===== */
const isMoney=el=>el&&el.matches&&el.matches('input[inputmode="decimal"]');
function maskMoney(el){
  const d=el.value.replace(/\D/g,"").replace(/^0+/,"").slice(0,12);
  el.value=d?(parseInt(d,10)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):"";
  const n=el.value.length; try{el.setSelectionRange(n,n)}catch(e){}
}
document.addEventListener("input",e=>{if(isMoney(e.target))maskMoney(e.target)});
/* ao tocar no campo ele limpa; se sair sem digitar nada, volta o valor que tinha */
document.addEventListener("focusin",e=>{const el=e.target;if(!isMoney(el))return;el.dataset.prev=el.value;el.value=""});
/* o Safari do iPhone não dispara "change" quando o valor foi formatado pela máscara, então salva ao sair do campo */
document.addEventListener("focusout",e=>{const el=e.target;if(!isMoney(el))return;const prev=el.dataset.prev;
  if(el.value===""&&prev&&num(prev)!==0)el.value=prev; delete el.dataset.prev;
  if(el.value!==""&&num(el.value)!==num(prev))aplicaCampo(el)});
function saveForm(){if(!$("gValor"))return;form.valor=$("gValor").value;form.desc=$("gDesc").value;form.data=$("gData").value||HOJE}
document.addEventListener("change",e=>aplicaCampo(e.target));
function aplicaCampo(t){
  const d=t.dataset;
  if(d.saldo!==undefined){S.contas[+d.saldo].saldo=num(t.value)}
  else if(d.fat){S.fatura[d.fat]=num(t.value)}
  else if(d.card){if(d.card==="limite")S.cartao.limite=num(t.value);else{const n=Math.round(num(t.value));if(n>=1&&n<=31)S.cartao[d.card]=n}}
  else if(d.mt!==undefined){const m=S.metas[+d.mt];m[d.f]=["nome","e"].includes(d.f)?t.value:num(t.value)}
  else if(d.fx!==undefined){const f=S.fixos[+d.fx];f[+d.c]=d.c==="1"?num(t.value):t.value}
  else if(d.ap!==undefined){const x=S.aPagar[+d.ap];x[d.f]=d.f==="valor"?num(t.value):t.value}
  else if(d.ct!==undefined){const c=S.cats[+d.ct],old=c.n;c[d.f]=t.value;if(d.f==="n")S.gastos.forEach(g=>{if(g.cat===old)g.cat=t.value})}
  else return;
  /* espera o foco ir pro próximo campo antes de redesenhar */
  setTimeout(()=>{commit(); if(t.closest("#sheet")&&(d.fx!==undefined||d.ap!==undefined||d.ct!==undefined||d.card))sheetAjustes();},0);
}
function go(t){tab=t;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.id==="t-"+t));
  document.querySelectorAll("nav.bn button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===t));scrollTo(0,0)}

/* ================= SALVAR ================= */
let saveT=null,lastSaved="",ready=false;
const setSave=t=>$("saveState").textContent=t;
function queueSave(){if(!ready)return;clearTimeout(saveT);setSave("Salvando…");saveT=setTimeout(()=>save(),600)}
function merge(o){
  if(!o||o.v!==2){ /* estado antigo: aproveita fixos e o guardado do carro */
    const n=structuredClone(DEFAULTS);
    if(o&&Array.isArray(o.fixos))n.fixos=o.fixos;
    const car=o&&Array.isArray(o.metas)&&o.metas.find(m=>m.id==="carro"); if(car)n.metas[0].tenho=+car.guardado||n.metas[0].tenho;
    S=n; return;
  }
  S=Object.assign(structuredClone(DEFAULTS),o); S.cartao=Object.assign({fecha:28,vence:13,limite:8150},S.cartao||{});
  (S.aPagar||[]).forEach(a=>{if(!a.credor&&/\(pai\)|\bpai\b/i.test(a.desc||""))a.credor="pai"}); S.projetos=S.projetos||[];
}
let save=()=>{};
render(); setSave("Carregando…");

if(PREVIA){
  const KEY="fin-previa-v2";
  save=function(){saveT=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}setSave("Prévia · salvo")};
  window.resetPrevia=function(){try{localStorage.removeItem(KEY);localStorage.removeItem("fin-previa-inbox");localStorage.removeItem("fin-previa-frana")}catch(e){}location.reload()};
  let salvo=null; try{salvo=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  if(salvo)merge(salvo);
  try{FR=JSON.parse(localStorage.getItem("fin-previa-frana")||"null")||structuredClone(FRANA_PREVIA)}catch(e){FR=structuredClone(FRANA_PREVIA)}
  try{const ib=JSON.parse(localStorage.getItem("fin-previa-inbox")||"null");INBOX=(ib?[...ib,...INBOX_PREVIA.filter(p=>p.id==="ex3"&&!ib.some(x=>x.id==="ex3")&&!localStorage.getItem("fin-previa-ex3"))]:structuredClone(INBOX_PREVIA)).filter(x=>x.id!=="ex2")}catch(e){INBOX=structuredClone(INBOX_PREVIA)}
  ready=true; if(sincTatEntradas())save(); render(); setSave("Prévia");
}else{
  save=async function(){saveT=null;const body=JSON.stringify(S);
    const {error}=await sb.from("fin_plano").upsert({estado:S},{onConflict:"user_id"});
    if(error){setSave("Erro ao salvar");console.error(error)}else{lastSaved=body;setSave("Salvo")}};
  async function loadFrana(){
    const r=await sb.from("frana_docs").select("id,col,data").in("col",["reembolsos","tattoos","events"]);
    if(r.error)return;
    const pick=c=>r.data.filter(x=>x.col===c).map(x=>({id:x.id,...x.data}));
    FR={reembolsos:pick("reembolsos"),tattoos:pick("tattoos"),events:pick("events")};
  }
  async function loadInbox(){const r=await sb.from("fin_inbox").select("*").order("criado_em");if(!r.error)INBOX=r.data||[]}
  onSbReady(async user=>{
    const {data,error}=await sb.from("fin_plano").select("estado").maybeSingle();
    if(error){setSave("Erro ao carregar");console.error(error);return}
    ready=true;
    merge(data&&data.estado);
    if(!data||!data.estado||data.estado.v!==2) await save(); else lastSaved=JSON.stringify(S);
    await loadFrana(); await loadInbox(); if(sincTatEntradas())await save(); render(); setSave("Salvo");
    sb.channel("fin-"+user.id)
      .on("postgres_changes",{event:"*",schema:"public",table:"fin_plano",filter:"user_id=eq."+user.id},p=>{
        if(p.eventType==="DELETE"||saveT)return; const b=JSON.stringify(p.new.estado);
        if(b!==lastSaved&&!document.activeElement.matches("input,select,textarea")){merge(p.new.estado);lastSaved=JSON.stringify(S);render()}})
      .on("postgres_changes",{event:"*",schema:"public",table:"frana_docs",filter:"user_id=eq."+user.id},async p=>{
        const row=p.eventType==="DELETE"?p.old:p.new; if(row&&row.col&&!["reembolsos","tattoos","events"].includes(row.col))return;
        await loadFrana();
        /* pega o estado mais novo antes de lançar, pra não duplicar se o app estiver aberto em dois aparelhos */
        const f=await sb.from("fin_plano").select("estado").maybeSingle(); if(f.data&&f.data.estado&&!saveT){merge(f.data.estado)}
        if(sincTatEntradas())await save(); render()})
      .on("postgres_changes",{event:"*",schema:"public",table:"fin_inbox",filter:"user_id=eq."+user.id},async()=>{await loadInbox();render()})
      .subscribe();
  });
}
</script>
