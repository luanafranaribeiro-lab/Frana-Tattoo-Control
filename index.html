<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Frana Tattoo Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E4ECF5;
    --surface:#FAFCFE;
    --surface-2:#DCE7F3;
    --border:#BDD0E3;
    --text:#16232F;
    --text-muted:#5E7286;
    --accent:#2159A0;
    --accent-contrast:#FAFCFE;
    --positive:#3D7A55;
    --warning:#A66A12;
    --danger:#C0392B;
    --radius-s:6px;
    --radius-m:12px;
    --radius-l:20px;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1621;
      --surface:#161E2B;
      --surface-2:#202B3C;
      --border:#324058;
      --text:#E7EDF6;
      --text-muted:#8C9BB2;
      --accent:#5B9EE6;
      --accent-contrast:#0F1621;
      --positive:#82C08F;
      --warning:#E0A85C;
      --danger:#EF5B4E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1621;
    --surface:#161E2B;
    --surface-2:#202B3C;
    --border:#324058;
    --text:#E7EDF6;
    --text-muted:#8C9BB2;
    --accent:#5B9EE6;
    --accent-contrast:#0F1621;
    --positive:#82C08F;
    --warning:#E0A85C;
    --danger:#EF5B4E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:-0.01em;}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent);color:var(--accent-contrast);}

  #app{display:flex;min-height:100vh;}

  /* ---------- NAV ---------- */
  #nav{
    width:236px;flex-shrink:0;
    display:flex;flex-direction:column;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:22px 14px;
    position:sticky;top:0;height:100vh;
  }
  .brand{padding:2px 10px 22px;}
  .brand-mark{font-size:22px;font-family:var(--font-display);font-weight:700;line-height:1.15;}
  .brand-mark span{color:var(--accent);}
  .brand-sub{font-size:12px;color:var(--text-muted);margin-top:4px;font-style:italic;}
  .navlist{display:flex;flex-direction:column;gap:2px;flex:1;}
  .navitem{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:var(--radius-s);
    border:none;background:transparent;color:var(--text-muted);
    font-size:14.5px;font-weight:500;cursor:pointer;text-align:left;width:100%;
  }
  .navitem svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .navitem:hover{background:var(--surface-2);color:var(--text);}
  .navitem.active{background:var(--accent);color:var(--accent-contrast);}
  .nav-foot{font-size:11px;color:var(--text-muted);padding:10px 12px 0;border-top:1px solid var(--border);margin-top:10px;}

  .theme-toggle{
    position:fixed;top:16px;right:16px;z-index:40;
    width:38px;height:38px;border-radius:50%;
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .theme-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .logout-btn{right:64px;}
  #auth-root{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
  .auth-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:28px 24px;box-shadow:0 4px 20px rgba(0,0,0,.14);}

  main{flex:1;min-width:0;padding:34px 40px 60px;max-width:980px;}

  @media (max-width:760px){
    #app{flex-direction:column;}
    #nav{
      position:fixed;bottom:0;left:0;right:0;top:auto;height:68px;width:100%;
      flex-direction:row;align-items:center;padding:6px 4px;
      border-right:none;border-top:1px solid var(--border);z-index:45;
    }
    .brand,.nav-foot{display:none;}
    .navlist{flex-direction:row;width:100%;justify-content:space-around;gap:0;}
    .navitem{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 2px;border-radius:var(--radius-s);}
    main{padding:26px 16px 96px;max-width:none;}
    .theme-toggle{top:auto;bottom:78px;right:14px;}
    .logout-btn{bottom:78px;right:60px;}
  }

  /* ---------- shared bits ---------- */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .page-head h1{font-size:26px;}
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 15px;border-radius:var(--radius-s);
    border:1px solid transparent;background:var(--accent);color:var(--accent-contrast);
    font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .btn.secondary{background:transparent;border-color:var(--border);color:var(--text);}
  .btn.ghost{background:transparent;border:none;color:var(--text-muted);padding:6px 8px;}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.block{width:100%;justify-content:center;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .icon-btn{
    width:30px;height:30px;border-radius:var(--radius-s);border:1px solid var(--border);
    background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  .icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .icon-btn:hover{color:var(--danger);border-color:var(--danger);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;}
  .grid{display:grid;gap:12px;}
  .grid-stats{grid-template-columns:repeat(4,1fr);}
  @media (max-width:700px){.grid-stats{grid-template-columns:repeat(2,1fr);}}
  .stat-label{font-size:12px;color:var(--text-muted);margin-bottom:6px;}
  .stat-value{font-size:22px;font-weight:600;}
  .stat-value.pos{color:var(--positive);}
  .stat-value.neg{color:var(--danger);}

  .dash-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);overflow:hidden;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .dash-hero>div{padding:22px 22px;position:relative;}
  .dash-hero>div:first-child{border-right:1px solid var(--border);background:linear-gradient(135deg, var(--surface) 60%, var(--surface-2) 200%);}
  .dash-hero-label{display:flex;align-items:center;gap:7px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);font-weight:700;margin-bottom:10px;}
  .dash-hero-label svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .dash-hero-value{font-family:var(--font-display);font-size:38px;font-weight:600;letter-spacing:-0.01em;line-height:1.05;}
  .dash-hero-value.pos{color:var(--positive);}
  .dash-hero-value.neg{color:var(--danger);}
  .dash-hero-sub{font-size:12px;color:var(--text-muted);margin-top:6px;}
  @media (max-width:560px){.dash-hero{grid-template-columns:1fr;}.dash-hero>div:first-child{border-right:none;border-bottom:1px solid var(--border);}.dash-hero-value{font-size:32px;}}

  .dash-pills{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:28px;}
  @media (max-width:700px){.dash-pills{grid-template-columns:repeat(2,1fr);}.dash-pills>*:nth-child(5){grid-column:1/-1;}}
  .dash-pill{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:13px 14px;}
  .dash-pill-label{display:flex;align-items:center;gap:6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dash-pill-label svg{width:12px;height:12px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .dash-pill-value{font-family:var(--font-mono);font-size:18px;font-weight:600;}
  .dash-pill-value.pos{color:var(--positive);}
  .dash-pill-value.neg{color:var(--danger);}
  .dash-pill-clickable{cursor:pointer;transition:border-color .15s,transform .1s;}
  .dash-pill-clickable:hover{border-color:var(--accent);}
  .dash-pill-clickable:active{transform:scale(.98);}

  .picker-field-btn{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-s);
    padding:11px 13px;font-size:14px;font-family:inherit;color:var(--text);cursor:pointer;text-align:left;
  }
  .picker-field-btn svg{width:16px;height:16px;stroke:var(--text-muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .picker-field-text{font-family:var(--font-mono);}

  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-month-label{font-family:var(--font-display);font-size:15px;font-weight:600;text-transform:capitalize;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-weekdays{margin-bottom:4px;}
  .cal-weekdays div{text-align:center;font-size:10.5px;color:var(--text-muted);font-weight:700;min-width:0;}
  .cal-cell{
    aspect-ratio:1;width:100%;max-width:38px;margin:0 auto;box-sizing:border-box;padding:0;min-width:0;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    border:none;background:none;font-family:var(--font-mono);font-size:12.5px;color:var(--text);cursor:pointer;
  }
  .cal-cell:hover{background:var(--surface-2);}
  .cal-cell.empty{cursor:default;}
  .cal-cell.empty:hover{background:none;}
  .cal-cell.today{color:var(--accent);font-weight:700;}
  .cal-cell.sel{background:var(--accent);color:#fff;font-weight:700;}

  .time-wheel-wrap{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:160px;}
  .time-wheel{height:160px;width:64px;overflow-y:scroll;scroll-snap-type:y mandatory;text-align:center;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .time-wheel::-webkit-scrollbar{display:none;}
  .time-wheel-item{height:40px;line-height:40px;scroll-snap-align:center;font-family:var(--font-mono);font-size:22px;color:var(--text-muted);}
  .time-wheel-spacer{height:60px;}
  .time-wheel-sep{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--text-muted);}
  .time-wheel-highlight{position:absolute;left:0;right:0;top:60px;height:40px;border-top:1.5px solid var(--border);border-bottom:1.5px solid var(--border);pointer-events:none;background:var(--surface-2);opacity:.5;border-radius:var(--radius-s);}

  .fab-atalhos-wrap{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;z-index:35;pointer-events:none;}
  @media (max-width:700px){.fab-atalhos-wrap{bottom:84px;}}
  .fab-atalhos{
    pointer-events:auto;display:inline-flex;align-items:center;gap:8px;
    background:var(--accent);color:#fff;border:none;border-radius:999px;
    padding:13px 22px;font-size:14px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.22);
  }
  .fab-atalhos svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .fab-atalhos.open{background:var(--text);}
  .fab-backdrop{position:fixed;inset:0;background:rgba(8,13,22,.4);z-index:33;pointer-events:auto;}
  .fab-sheet{
    pointer-events:auto;position:absolute;bottom:56px;left:50%;transform:translateX(-50%);
    width:min(92vw,420px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);
    box-shadow:0 8px 28px rgba(0,0,0,.22);padding:16px 16px 18px;z-index:34;
  }
  .fab-sheet .chip-row{justify-content:center;}

  .list{display:flex;flex-direction:column;gap:10px;}
  .row-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .row-title{font-weight:600;font-size:14.5px;}
  .row-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  .row-actions{display:flex;gap:6px;align-items:center;}

  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
    font-size:11px;font-weight:600;border:1px solid var(--border);color:var(--text-muted);
  }
  .badge-btn{background:none;cursor:pointer;font:inherit;}
  .badge.ok{color:var(--positive);border-color:var(--positive);}
  .badge.warn{color:var(--warning);border-color:var(--warning);}
  .badge.danger{color:var(--danger);border-color:var(--danger);}
  .badge.accent{color:var(--accent);border-color:var(--accent);}

  .empty{
    border:1px dashed var(--border);border-radius:var(--radius-m);padding:28px 20px;
    text-align:center;color:var(--text-muted);font-size:13.5px;
  }

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:600;margin:26px 0 10px;}
  .section-title:first-child{margin-top:0;}

  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;}
  .tab-btn{padding:9px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);font-size:13.5px;font-weight:600;cursor:pointer;margin-right:14px;}
  .tab-btn.active{color:var(--accent);border-color:var(--accent);}

  .chip-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
  .chip{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:12.5px;font-weight:600;cursor:pointer;}
  .chip.active{background:var(--text);color:var(--surface);border-color:var(--text);}
  .chip.chip-danger{color:var(--danger);border-color:var(--danger);}
  .chip.chip-danger.active{background:var(--danger);color:#fff;border-color:var(--danger);}

  .month-nav{display:flex;align-items:center;gap:8px;}
  .month-label{font-family:var(--font-mono);font-size:13px;min-width:132px;text-align:center;text-transform:capitalize;}

  /* ---------- forms ---------- */
  label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;font-weight:600;}
  input,select,textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-s);
    padding:9px 11px;font-size:14px;color:var(--text);font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  textarea{resize:vertical;min-height:60px;}
  .field{margin-bottom:11px;min-width:0;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0;}
  .field-row-auto{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;min-width:0;}
  @media (max-width:480px){.field-row-auto{grid-template-columns:1fr;}}
  .field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;min-width:0;}
  .field-row>.field,.field-row3>.field{min-width:0;}
  input[type="date"]{min-width:0;}
  @media (max-width:480px){.field-row3{grid-template-columns:1fr;}}
  .hint{font-size:11.5px;color:var(--text-muted);margin-top:4px;}
  .type-picker{display:flex;gap:7px;flex-wrap:wrap;}
  .type-opt{padding:8px 13px;border-radius:var(--radius-s);border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer;}
  .type-opt.active{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}

  .consump-row{display:grid;grid-template-columns:1fr 70px 30px;gap:7px;align-items:center;margin-bottom:7px;}
  .consump-row:last-child{margin-bottom:0;}
  .cost-preview{
    display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);
    border-top:1px solid var(--border);padding-top:10px;margin-top:4px;
  }
  .cost-preview b{color:var(--text);font-family:var(--font-mono);}

  .materials-heading{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:7px;}
  .materials-heading svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .materials-group{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-m);padding:12px 13px 11px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .materials-group-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .materials-group-head span,.materials-group-head-label{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);}
  .add-line-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 2px;}
  .add-line-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .empty-mini{font-size:12px;color:var(--text-muted);padding:2px 0 4px;}
  .check-card{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-m);padding:11px 13px;margin-bottom:12px;cursor:pointer;transition:border-color .15s;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .check-card:has(input:checked){border-color:var(--accent);}
  .check-card input[type="checkbox"]{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
  .check-card .check-title{font-size:13.5px;font-weight:600;color:var(--text);}
  .check-card .check-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  .padrao-btn-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;}

  /* ---------- modal ---------- */
  #modal-root{position:relative;z-index:80;}
  #picker-root{position:relative;z-index:95;}
  .picker-backdrop{z-index:95;align-items:center;}
  .picker-backdrop .modal{max-width:330px;border-radius:var(--radius-l);border-bottom:1px solid var(--border);padding:16px 16px 18px;max-height:80vh;}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(8,13,22,.6);
    display:flex;align-items:flex-end;justify-content:center;z-index:80;
  }
  @media (min-width:640px){.modal-backdrop{align-items:center;}}
  .modal{
    background:var(--surface);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    border-radius:18px 18px 0 0;border:1px solid var(--border);border-bottom:none;
    padding:20px 20px 26px;
  }
  @media (min-width:640px){.modal{border-radius:var(--radius-l);border-bottom:1px solid var(--border);}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h3{font-size:19px;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .confirm-text{font-size:14px;line-height:1.5;margin-bottom:4px;}

  .banner{
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-s);
    padding:10px 13px;font-size:12.5px;color:var(--text-muted);margin-bottom:18px;display:flex;gap:8px;align-items:center;
  }
  .banner svg{width:15px;height:15px;stroke:var(--warning);fill:none;stroke-width:1.7;flex-shrink:0;}

  .greet{margin-bottom:24px;display:flex;align-items:center;gap:16px;}
  .greet-logo{

/* ============ STATE ============ */

/* ============ HELPERS ============ */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function round2(n){ return Math.round((Number(n)||0 + Number.EPSILON)*100)/100; }
function round4(n){ return Math.round((Number(n)||0 + Number.EPSILON)*10000)/10000; }
function brl(n){ return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function pctFmt(n){ if(!isFinite(n)) n=0; return n.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%'; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function defaultDateForNewRecord(){
  if(dashboardMonth && dashboardMonth !== monthNow()){
    const [y,m] = dashboardMonth.split('-').map(Number);
    const lastDay = new Date(y, m, 0).getDate();
    const day = Math.min(new Date().getDate(), lastDay);
    return `${dashboardMonth}-${String(day).padStart(2,'0')}`;
  }
  return todayISO();
}
function monthNow(){ return new Date().toISOString().slice(0,7); }
function fmtDateBR(iso){ if(!iso) return '—'; const p=iso.split('-'); return p.length===3? `${p[2]}/${p[1]}/${p[0]}` : iso; }
function shiftMonth(ym,delta){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+delta,1); return d.toISOString().slice(0,7); }
function monthLabel(ym){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1,1); return d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); }
function sortByDateDesc(a,b){ return (b.date||'').localeCompare(a.date||''); }

/* ============ DB LAYER (Supabase) ============ */
const SUPABASE_URL = 'https://bwomclwfmenrhhmpwzom.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_U1XxtSGN3BFkOrEoQSdyLQ_h6sLe-Vy';
const COLS = ['stock','tattoos','events','flashes','shopping','agenda','settings','reembolsos'];
let supa = null;
let currentUser = null;
let dbAvailable = false;
let realtimeChannel = null;

async function initDb(){
  try{
    if(!window.supabase || !window.supabase.createClient) throw new Error('supabase-js not loaded');
    supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data:{ session } } = await supa.auth.getSession();
    if(session && session.user){
      currentUser = session.user;
      await bootAfterLogin();
    } else {
      showLoginScreen();
    }
    supa.auth.onAuthStateChange((event, session)=>{
      if(event==='SIGNED_IN' && session && session.user && (!currentUser || currentUser.id!==session.user.id)){
        currentUser = session.user;
        bootAfterLogin();
      } else if(event==='SIGNED_OUT'){
        currentUser = null; dbAvailable = false;
        if(realtimeChannel){ supa.removeChannel(realtimeChannel); realtimeChannel = null; }
        COLS.forEach(c=>state[c]=[]);
        showLoginScreen();
      }
    });
  }catch(e){
    console.error('Supabase indisponível, entrando em modo prévia local.', e);
    dbAvailable = false;
    document.getElementById('app').style.display = '';
    document.getElementById('auth-root').style.display = 'none';
    renderApp();
  }
}
function showLoginScreen(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('auth-root').style.display = 'flex';
  const form = document.getElementById('loginForm');
  form.onsubmit = async (e)=>{
    e.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    if(btn.disabled) return;
    btn.disabled = true;
    document.getElementById('loginError').textContent = '';
    const { error } = await supa.auth.signInWithPassword({ email: form.elements.email.value.trim(), password: form.elements.password.value });
    if(error){
      document.getElementById('loginError').textContent = 'E-mail ou senha incorretos.';
      btn.disabled = false;
    }
  };
}
async function bootAfterLogin(){
  document.getElementById('auth-root').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('logoutBtn').style.display = '';
  dbAvailable = true;
  await loadAllCollections();
  subscribeRealtime();
}
async function loadAllCollections(){
  try{
    const { data: rows, error } = await supa.from('frana_docs').select('col,id,data').eq('user_id', currentUser.id);
    if(error) throw error;
    COLS.forEach(c=>state[c]=[]);
    (rows||[]).forEach(r=>{ if(state[r.col]) state[r.col].push({id:r.id, ...r.data}); });
    renderApp();
  }catch(e){ console.error('Erro ao carregar dados do Supabase', e); }
}
function subscribeRealtime(){
  realtimeChannel = supa.channel('frana_docs_'+currentUser.id)
    .on('postgres_changes', {event:'*', schema:'public', table:'frana_docs', filter:`user_id=eq.${currentUser.id}`}, payload=>{
      const row = (payload.new && Object.keys(payload.new).length) ? payload.new : payload.old;
      if(!row || !state[row.col]) return;
      if(payload.eventType==='DELETE'){
        state[row.col] = state[row.col].filter(x=>x.id!==row.id);
      } else {
        const doc = {id: row.id, ...row.data};
        const idx = state[row.col].findIndex(x=>x.id===row.id);
        if(idx>=0) state[row.col][idx] = doc; else state[row.col].push(doc);
      }
      renderApp();
    })
    .subscribe();
}

async function colAdd(col, data){
  if(!dbAvailable || !supa){
    const id = uid();
    state[col] = [...state[col], {id, ...data}];
    renderApp();
    return {id};
  }
  const id = uid();
  const { error } = await supa.from('frana_docs').insert({user_id:currentUser.id, col, id, data});
  if(error){ console.error(error); throw error; }
  return {id};
}
async function colUpdate(col, id, patch){
  if(!dbAvailable || !supa){
    state[col] = state[col].map(x=> x.id===id ? {...x, ...patch} : x);
    renderApp();
    return;
  }
  const { data: existing, error: selErr } = await supa.from('frana_docs').select('data').eq('user_id', currentUser.id).eq('col', col).eq('id', id).maybeSingle();
  if(selErr){ console.error(selErr); throw selErr; }
  const merged = {...(existing&&existing.data||{}), ...patch};
  const { error } = await supa.from('frana_docs').update({data:merged, atualizado_em:new Date().toISOString()}).eq('user_id', currentUser.id).eq('col', col).eq('id', id);
  if(error){ console.error(error); throw error; }
}
async function colDelete(col, id){
  if(!dbAvailable || !supa){
    state[col] = state[col].filter(x=>x.id!==id);
    renderApp();
    return;
  }
  const { error } = await supa.from('frana_docs').delete().eq('user_id', currentUser.id).eq('col', col).eq('id', id);
  if(error){ console.error(error); throw error; }
}
async function colUpsert(col, id, data){
  if(!dbAvailable || !supa){
    const idx = state[col].findIndex(x=>x.id===id);
    if(idx>=0) state[col] = state[col].map(x=>x.id===id?{...x,...data}:x);
    else state[col] = [...state[col], {id, ...data}];
    renderApp();
    return;
  }
  const { error } = await supa.from('frana_docs').upsert({user_id:currentUser.id, col, id, data}, {onConflict:'user_id,col,id'});
  if(error){ console.error(error); throw error; }
}
function getFuelDefaults(){
  const s = state.settings.find(x=>x.id==='combustivel');
  return s || {consumo:'', precoLitro:''};
}

async function adjustStock(stockId, delta){
  const item = state.stock.find(s=>s.id===stockId);
  if(!item) return;
  await colUpdate('stock', stockId, {quantity: round2((item.quantity||0)+delta)});
}
async function applyConsumptions(consumptions){
  for(const c of consumptions){ if(c.stockId && c.qty){ await adjustStock(c.stockId, -Math.abs(c.qty)); } }
}
async function revertConsumptions(consumptions){
  for(const c of consumptions){ if(c.stockId && c.qty){ await adjustStock(c.stockId, Math.abs(c.qty)); } }
}
function buildConsumptionSnapshot(raw){
  return raw.filter(c=>c.stockId && Number(c.qty)>0).map(c=>{
    const item = state.stock.find(s=>s.id===c.stockId);
    return { stockId:c.stockId, qty:Number(c.qty), name:item?item.name:'Item removido', unit:item?item.unit:'', cost:item?(item.costPerUnit||0):0 };
  });
}
function consumptionsCost(consumptions){ return consumptions.reduce((s,c)=>s+(c.qty*c.cost),0); }

/* ============ DERIVED ============ */
function tattooProfit(t){ return round2((t.value||0) - (t.costTotal||0)); }
function eventTattoos(eventId){ return state.tattoos.filter(t=>t.eventId===eventId); }
function eventExpensesTotal(ev){ return (ev.expenses||[]).reduce((s,e)=>s+(e.value||0),0); }
function eventFaturamento(eventId){ return eventTattoos(eventId).reduce((s,t)=>s+(t.value||0),0); }
function eventMateriais(eventId){ return eventTattoos(eventId).reduce((s,t)=>s+(t.costTotal||0),0); }
function stockValueTotal(){ return state.stock.reduce((s,i)=>s+((i.quantity||0)*(i.costPerUnit||0)),0); }
function lowStockItems(){ return state.stock.filter(s=> (Number(s.quantity)||0) <= (Number(s.minStock)||0)); }

function renderApp(){
  renderNav();
  const main = document.getElementById('main');
  if(activeTab==='inicio') main.innerHTML = renderDashboard();
  else if(activeTab==='agenda') main.innerHTML = renderAgenda();
  else if(activeTab==='tattoos') main.innerHTML = renderTattoos();
  else if(activeTab==='eventos') main.innerHTML = activeEventId ? renderEventDetail() : renderEventsList();
  else if(activeTab==='estoque') main.innerHTML = renderEstoque();
  else if(activeTab==='compras') main.innerHTML = renderCompras();
}

/* ============ CONN BANNER ============ */
function connBannerHtml(){
  if(dbAvailable) return '';
  return `<div class="banner">${ICONS.alert}<span>Não foi possível conectar ao banco agora — as alterações não serão salvas. Isso é esperado na prévia do Claude; no site publicado funciona normalmente.</span></div>`;
}

/* ============ DASHBOARD ============ */

  const eventsF = state.events.filter(e=> all || (e.date||'').slice(0,7)===dashboardMonth);
  const agendaF = state.agenda.filter(a=> all || (a.date||'').slice(0,7)===dashboardMonth);
  const faturamento = tattoosF.filter(isPago).reduce((s,t)=>s+(t.value||0),0);
  const aReceberAgenda = agendaF.reduce((s,a)=>s+Math.max(0,(a.value||0)-(a.sinal||0)),0);
  const aReceberTattoos = tattoosF.filter(t=>!isPago(t)).reduce((s,t)=>s+(t.value||0),0);
  const aReceber = round2(aReceberAgenda + aReceberTattoos);
  const custoMateriais = tattoosF.reduce((s,t)=>s+(t.costTotal||0),0);

  const faturaCartaoMes = state.reembolsos.filter(r=> all || (r.date||'').slice(0,7)===dashboardMonth).reduce((s,r)=>s+(r.value||0),0);
  const gasto = round2(custoMateriais+despesasEventos+gastosAvulsos);

/* ============ TATTOOS ============ */
function renderTattoos(){
  const months = {};
  state.tattoos.forEach(t=>{
    const ev = t.eventId ? state.events.find(e=>e.id===t.eventId) : null;
    const ym = ev ? ((ev.date||'').slice(0,7) || 'sem-data') : ((t.date||'').slice(0,7) || 'sem-data');
    if(!months[ym]) months[ym] = {events:{}, loose:[]};
    if(ev) (months[ym].events[ev.id] = months[ym].events[ev.id]||[]).push(t);
    else months[ym].loose.push(t);
  });
  const sortedMonths = Object.keys(months).sort((a,b)=>b.localeCompare(a));
  const monthsHtml = sortedMonths.map(ym=>{
    const group = months[ym];
    const eventIds = Object.keys(group.events).sort((a,b)=>{
      const da = group.events[a].map(t=>t.date||'').sort().pop()||'', db = group.events[b].map(t=>t.date||'').sort().pop()||'';
      return db.localeCompare(da);
    });
    const eventCardsHtml = eventIds.map(eid=>{
      const ev = state.events.find(e=>e.id===eid);
      const evTattoos = [...group.events[eid]].sort(sortByDateDesc);
      const qtd = evTattoos.length;
      const faturamento = evTattoos.reduce((s,t)=>s+(t.value||0),0);
      const gasto = round2(evTattoos.reduce((s,t)=>s+(t.costTotal||0),0) + eventExpensesTotal(ev));
      const lucro = round2(faturamento - gasto);
      return `
        <div class="row-card" data-action="openEventFromTattoos" data-id="${eid}" style="cursor:pointer;">
          <div>
            <div class="row-title">${escapeHtml(ev.name)}</div>
            <div class="row-sub">${qtd} tattoo${qtd===1?'':'s'} · gasto ${brl(gasto)} · lucro <span style="color:${lucro>=0?'var(--positive)':'var(--danger)'}">${brl(lucro)}</span></div>
          </div>
        </div>`;
    }).join('');
    const looseRowsHtml = [...group.loose].sort(sortByDateDesc).map(t=>tattooRow(t)).join('');
    return `
      <div class="section-title">${ym==='sem-data'?'Sem data':monthLabel(ym)}</div>
      <div class="list">${eventCardsHtml}${looseRowsHtml}</div>
    `;
  }).join('');
  return `
    ${connBannerHtml()}
    <div class="page-head"><h1>Tattoos</h1>
      <button class="btn" data-action="openTattooForm">${ICONS.plus} Registrar tattoo</button>
    </div>
    ${sortedMonths.length? monthsHtml : `<div class="empty">Nenhuma tattoo registrada ainda.</div>`}
  `;
}
function isPago(t){ return t.pago !== false; }
function tattooRow(t, hideEventBadge){

  const ev = (!hideEventBadge && t.eventId) ? state.events.find(e=>e.id===t.eventId) : null;

  const pago = isPago(t);
  return `

        <div class="row-title">${escapeHtml(t.client||'Sem identificação')} ${ev?`<span class="badge accent" style="margin-left:6px;">${escapeHtml(ev.name)}</span>`:''}</div>
        <div class="row-sub">${fmtDateBR(t.date)} · ${t.type||'—'} · custo ${brl(t.costTotal||0)} · lucro <span style="color:${profit>=0?'var(--positive)':'var(--danger)'}">${brl(profit)}</span></div>

        </div>
      </div>
    </div>`;

function stockUrgency(s){
  const min = Number(s.minStock)||0, qty = Number(s.quantity)||0;
  if(min<=0) return qty<=0 ? -Infinity : Infinity;
  return qty/min;
}
function renderEstoque(){
  const cats = ['todos','baixo', ...Object.keys(TIPOS)];
  const listStock = state.stock.filter(s=>s.category!==MIMO_CATEGORY);
  const low = listStock.filter(s=> (Number(s.quantity)||0) <= (Number(s.minStock)||0));
  const lowSorted = [...low].sort((a,b)=>stockUrgency(a)-stockUrgency(b));
  let filtered, sorted;
  if(stockFilter==='baixo'){
    filtered = low; sorted = lowSorted;
  } else {
    filtered = stockFilter==='todos' ? listStock : listStock.filter(s=>s.category===stockFilter);
    sorted = [...filtered].sort((a,b)=>a.name.localeCompare(b.name));
  }
  return `
    ${connBannerHtml()}
    <div class="page-head"><h1>Estoque</h1>
      <button class="btn" data-action="openStockForm">${ICONS.plus} Adicionar compra / material</button>

      <div data-action="setStockFilter" data-cat="baixo" style="cursor:pointer;">
        <div class="stat-label">Itens abaixo do mínimo</div>
        <div class="stat-value num ${low.length?'neg':''}">${low.length}</div>
      </div>

    <div class="chip-row">
      ${cats.map(c=>`<button class="chip ${stockFilter===c?'active':''} ${c==='baixo'?'chip-danger':''}" data-action="setStockFilter" data-cat="${c}">${c==='todos'?'Todos':c==='baixo'?`⚠ Abaixo do mínimo`:tipoLabel(c)}</button>`).join('')}
    </div>
    ${sorted.length? `<div class="list">${sorted.map(stockRow).join('')}</div>` : `<div class="empty">${stockFilter==='baixo'?'Nada abaixo do mínimo — estoque tranquilo.':'Nenhum item nesta categoria.'}</div>`}

function syncBranco(){
  activeConsumptions = activeConsumptions.filter(c=>c.kind!=='branco-auto');
  if(activeBranco){
    const white = findWhiteTinta(), copinho = findCopinho(), solid = findSolidificador();
    if(white) activeConsumptions.push({stockId:white.id, qty:0.5, kind:'branco-auto'});
    if(copinho) activeConsumptions.push({stockId:copinho.id, qty:1, kind:'branco-auto'});
    if(solid) activeConsumptions.push({stockId:solid.id, qty:0.2, kind:'branco-auto'});
  }
}
function syncAutoAllTT(){
  syncBranco();
  const batoqueDefault = findStockByCategory('batoque');
  const tintaCount = activeConsumptions.filter(c=>c.kind==='tinta' && c.stockId).length;
  const needed = tintaCount + (activeBranco?1:0);
  if(batoqueDefault){
    let autoIdx = activeConsumptions.map((c,i)=>({c,i})).filter(x=>x.c.kind==='batoque-auto').map(x=>x.i);
    while(autoIdx.length < needed){ activeConsumptions.push({stockId:batoqueDefault.id, qty:1, kind:'batoque-auto'}); autoIdx.push(activeConsumptions.length-1); }
    while(autoIdx.length > needed){ activeConsumptions.splice(autoIdx.pop(),1); }
  }
  activeConsumptions = activeConsumptions.filter(c=>c.kind!=='vitalderm');
  const vd = findStockByCategory('vitalderm');
  if(vd && activeVitaldermCm>0) activeConsumptions.push({stockId:vd.id, qty:round2(activeVitaldermCm/100), kind:'vitalderm'});
}

const LOCAL_CORPO_OPTIONS = ['Antebraço','Braço','Ombro','Perna','Coxa','Panturrilha','Costas','Peito','Costela','Mão','Pé','Pescoço','Outro'];

  return `<option value="">Selecionar…</option>` + DIFICULDADE_OPTIONS.map(o=>`<option value="${o}" ${o===selected?'selected':''}>${o}</option>`).join('');
}
const ORCAMENTO_BASE = {'Pequena (até 8cm)':150, 'Média (8–18cm)':350, 'Grande (18–28cm)':550, 'Extra grande (28cm+)':750};
const ORCAMENTO_MINIMO = 150;
const ORCAMENTO_DIFICULDADE_PCT_DEFAULT = {'Simples':0, 'Moderada':15, 'Complexa':30, 'Muito complexa':50};
const ORCAMENTO_LOCAL_PCT_DEFAULT = {'Antebraço':0,'Braço':0,'Ombro':0,'Perna':0,'Coxa':0,'Panturrilha':5,'Costas':0,'Peito':10,'Costela':20,'Mão':25,'Pé':20,'Pescoço':15,'Outro':0};
function getOrcamentoConfig(){
  const saved = state.settings.find(s=>s.id==='orcamentoConfig') || {};
  return {
    dificuldadePct: {...ORCAMENTO_DIFICULDADE_PCT_DEFAULT, ...(saved.dificuldadePct||{})},
    localPct: {...ORCAMENTO_LOCAL_PCT_DEFAULT, ...(saved.localPct||{})},
  };
}
function collectOrcamentoSamples(){
  const fromAgenda = state.agenda.filter(a=>a.tamanho && a.dificuldade && (a.value>0) && !a.condicaoEspecial).map(a=>({tamanho:a.tamanho, dificuldade:a.dificuldade, localCorpo:a.localCorpo||'', value:a.value}));
  const fromTattoos = state.tattoos.filter(t=>t.tamanho && t.dificuldade && (t.value>0) && !t.condicaoEspecial && t.type!=='Flash').map(t=>({tamanho:t.tamanho, dificuldade:t.dificuldade, localCorpo:t.localCorpo||'', value:t.value}));
  return [...fromAgenda, ...fromTattoos];
}
function estimateOrcamento(tamanho, dificuldade, localCorpo){
  const cfg = getOrcamentoConfig();
  const base = ORCAMENTO_BASE[tamanho] || ORCAMENTO_MINIMO;
  const dPct = cfg.dificuldadePct[dificuldade] || 0;
  const lPct = localCorpo ? (cfg.localPct[localCorpo]||0) : 0;
  const formulaValue = Math.round(base * (1 + (dPct+lPct)/100));

  const samples = collectOrcamentoSamples();
  const tiers = [
    {basis:'tamanho, dificuldade e local iguais', list: samples.filter(s=>s.tamanho===tamanho && s.dificuldade===dificuldade && localCorpo && s.localCorpo===localCorpo)},
    {basis:'mesmo tamanho e dificuldade', list: samples.filter(s=>s.tamanho===tamanho && s.dificuldade===dificuldade)},
    {basis:'mesmo tamanho', list: samples.filter(s=>s.tamanho===tamanho)},
  ];
  let hist = null;
  for(const tier of tiers){
    if(tier.list.length>0){
      const values = tier.list.map(s=>s.value);
      hist = {value: values.reduce((s,v)=>s+v,0)/values.length, count: values.length, min:Math.min(...values), max:Math.max(...values), basis: tier.basis};
      break;
    }
  }
  let value = hist ? Math.round(formulaValue*0.5 + hist.value*0.5) : formulaValue;
  value = Math.max(ORCAMENTO_MINIMO, value);
  return {value, formulaValue, hist, base, dPct, lPct};
}

      <div style="font-family:var(--font-mono);font-size:30px;font-weight:600;margin:4px 0;">${brl(est.value)}</div>
      ${est.hist && est.hist.count>1?`<div style="font-size:11.5px;color:var(--text-muted);">Faixa observada: ${brl(est.hist.min)} – ${brl(est.hist.max)}</div>`:''}

function formatDateBR(iso){
  if(!iso) return '';
  const parts = iso.split('-');
  if(parts.length!==3) return '';
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}
function parseDateBR(str, fallbackISO){
  const m = (str||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return fallbackISO;
  return `${m[3]}-${m[2]}-${m[1]}`;
}

function dateFieldHtml(name, iso, labelText){
  return `<div class="field">
    <label>${labelText}</label>
    <button type="button" class="picker-field-btn" data-datefield="${name}">
      <span class="picker-field-text" data-datetext="${name}">${iso?formatDateBR(iso):'Selecionar data'}</span>
      ${ICONS.calendar}
    </button>
    <input type="hidden" name="${name}" value="${iso||''}" />
  </div>`;
}
function formatDuration(hhmm){
  const mm = /^(\d{1,2}):(\d{2})$/.exec(hhmm||'');
  const h = mm?parseInt(mm[1],10):0, m = mm?parseInt(mm[2],10):0;
  if(h>0 && m>0) return `${h}h ${m}min`;
  if(h>0) return `${h}h`;
  return `${m}min`;
}
function parseDuracaoToHHMM(text){
  if(!text) return '00:15';
  const hMatch = text.match(/(\d+)\s*h/i);
  const mMatch = text.match(/(\d+)\s*m/i);
  let h = hMatch?parseInt(hMatch[1],10):0;
  let m = mMatch?parseInt(mMatch[1],10):0;
  if(!hMatch && !mMatch){
    const num = text.match(/(\d+)/);
    if(num) m = parseInt(num[1],10);
  }
  return `${String(Math.min(23,h)).padStart(2,'0')}:${String(Math.min(59,m)).padStart(2,'0')}`;
}
function durationFieldHtml(name, hhmm, labelText){
  return `<div class="field">

}

let calPickerState = null;
const CAL_MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function openDatePicker(currentISO, onPick){
  const base = currentISO ? new Date(currentISO+'T00:00:00') : new Date();
  calPickerState = { year: base.getFullYear(), month: base.getMonth(), selectedISO: currentISO, onPick };
  openPicker('Selecionar data', `<div id="calPickerBody"></div>`);
  renderCalPicker();
}
function renderCalPicker(){
  const {year, month, selectedISO} = calPickerState;
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayIso = todayISO();
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = [iso===selectedISO?'sel':'', iso===todayIso?'today':''].filter(Boolean).join(' ');
    cells += `<button type="button" class="cal-cell ${cls}" data-iso="${iso}">${d}</button>`;
  }
  document.getElementById('calPickerBody').innerHTML = `
    <div class="cal-nav">
      <button type="button" class="icon-btn" id="calPrev">${ICONS.chevL}</button>
      <span class="cal-month-label">${CAL_MONTH_NAMES[month]} ${year}</span>
      <button type="button" class="icon-btn" id="calNext">${ICONS.chevR}</button>
    </div>
    <div class="cal-grid cal-weekdays"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>
    <div class="cal-grid">${cells}</div>
    <button type="button" class="btn secondary block" id="calToday" style="margin-top:14px;">Hoje</button>
  `;
  document.getElementById('calPrev').onclick = ()=>{ calPickerState.month--; if(calPickerState.month<0){calPickerState.month=11; calPickerState.year--;} renderCalPicker(); };
  document.getElementById('calNext').onclick = ()=>{ calPickerState.month++; if(calPickerState.month>11){calPickerState.month=0; calPickerState.year++;} renderCalPicker(); };
  document.getElementById('calToday').onclick = ()=>{ const t=todayISO(); calPickerState.onPick(t); closePicker(); };
  document.querySelectorAll('.cal-cell[data-iso]').forEach(btn=>{
    btn.onclick = ()=>{ calPickerState.onPick(btn.dataset.iso); closePicker(); };
  });
}
const TIME_WHEEL_ITEM_H = 40;
function openTimePicker(currentHHMM, onPick, title){
  const m = /^(\d{1,2}):(\d{2})$/.exec(currentHHMM||'');
  const hh = m ? Math.min(23, parseInt(m[1],10)) : 0;
  const mm = m ? Math.min(59, parseInt(m[2],10)) : 0;
  openPicker(title || 'Selecionar horário', `
    <div class="time-wheel-wrap">
      <div class="time-wheel-highlight"></div>
      <div class="time-wheel" id="wheelHours"><div class="time-wheel-spacer"></div>${Array.from({length:24},(_,i)=>`<div class="time-wheel-item" data-v="${i}">${String(i).padStart(2,'0')}</div>`).join('')}<div class="time-wheel-spacer"></div></div>
      <div class="time-wheel-sep">:</div>
      <div class="time-wheel" id="wheelMinutes"><div class="time-wheel-spacer"></div>${Array.from({length:60},(_,i)=>`<div class="time-wheel-item" data-v="${i}">${String(i).padStart(2,'0')}</div>`).join('')}<div class="time-wheel-spacer"></div></div>
    </div>
    <button type="button" class="btn block" id="timeConfirm" style="margin-top:16px;">Confirmar</button>
  `);
  const hEl = document.getElementById('wheelHours'), mEl = document.getElementById('wheelMinutes');
  hEl.scrollTop = hh*TIME_WHEEL_ITEM_H;
  mEl.scrollTop = mm*TIME_WHEEL_ITEM_H;
  document.getElementById('timeConfirm').onclick = ()=>{
    const h = Math.max(0, Math.min(23, Math.round(hEl.scrollTop/TIME_WHEEL_ITEM_H)));
    const mi = Math.max(0, Math.min(59, Math.round(mEl.scrollTop/TIME_WHEEL_ITEM_H)));
    onPick(`${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`);
    closePicker();
  };
}

function flashRapidaAutoKitLines(){
  const vitalderm = findStockByCategory('vitalderm');
  const mimo = getMimoItem();
  const batoque = findStockByCategory('batoque');
  const numBatoques = flashRapidaTintas.filter(t=>t.stockId).length + (flashRapidaBranco?1:0);
  const lines = [];
  if(batoque && numBatoques>0) lines.push({item:batoque, qty:numBatoques});
  if(vitalderm) lines.push({item:vitalderm, qty:0.05});

    if(white) lines.push({item:white, qty:0.5});

  }
  return lines;

/* ---- stock form (Tipo-driven) ---- */
function stockFormExtrasHtml(tipoKey, values){
  const tipo = TIPOS[tipoKey];
  if(!tipo || !tipo.extraFields.length) return '';
  return tipo.extraFields.map(f=>{
    if(f.select){
      return `<div class="field"><label>${f.label}</label><select name="ef_${f.key}">
        ${f.select.map(opt=>`<option value="${opt}" ${values[f.key]===opt?'selected':''}>${opt}</option>`).join('')}
      </select></div>`;

    }
    const type = f.numeric ? 'number' : 'text';
    const val = values[f.key]!==undefined && values[f.key]!==null ? values[f.key] : (f.numeric && f.default!==undefined ? f.default : '');
    return `<div class="field"><label>${f.label}</label><input name="ef_${f.key}" type="${type}" ${f.numeric?'step="0.01"':''} value="${escapeHtml(val)}" placeholder="${f.placeholder||''}" /></div>`;
  }).join('');
}
function stockFormUnitHtml(tipoKey, currentUnit){
  const tipo = TIPOS[tipoKey];
  if(tipo.unitChoices){
    return `<label>Unidade</label><select name="unit">${tipo.unitChoices.map(u=>`<option value="${u}" ${(currentUnit||tipo.unit)===u?'selected':''}>${UNIT_LABELS[u]||u}</option>`).join('')}</select>`;
  }
  return `<label>Unidade</label><input type="text" value="${UNIT_LABELS[tipo.unit]||tipo.unit} (fixa)" disabled />`;
}
function refreshStockFormDynamic(tipoKey, item){
  const tipo = TIPOS[tipoKey];
  document.getElementById('tipoExtraFields').innerHTML = stockFormExtrasHtml(tipoKey, item||{});
  document.getElementById('unitFieldWrap').innerHTML = stockFormUnitHtml(tipoKey, item?item.unit:null);
  const hintEl = document.getElementById('tipoHint');
  hintEl.textContent = tipo.hint || '';
  const minEl = document.querySelector('#stockForm [name="minStock"]');
  if(minEl && !item && tipo.defaultMinStock!==undefined && !minEl.dataset.touched){
    minEl.value = tipo.defaultMinStock;
  }
  if(tipo.computeQuantity){
    const extrasContainer = document.getElementById('tipoExtraFields');
    const recompute = ()=>{
      const values = {};
      tipo.extraFields.forEach(fld=>{ const el=extrasContainer.querySelector(`[name="ef_${fld.key}"]`); if(el) values[fld.key] = fld.numeric ? (parseFloat(el.value)||0) : el.value.trim(); });
      const computed = tipo.computeQuantity(values);
      if(computed!==null && computed!==undefined){
        const qtyEl = document.querySelector('#stockForm [name="quantity"]');
        if(qtyEl) qtyEl.value = computed;
      }
    };
    extrasContainer.addEventListener('input', recompute);
    extrasContainer.addEventListener('change', recompute);
  }
}

        </div>
      </label>
      <div id="stockCartaoVencimentoWrap" style="display:none;">${dateFieldHtml('cartaoVencimentoBR', todayISO(), 'Data que vou pagar no cartão')}</div>
      <button type="submit" class="btn block">${item?'Salvar alterações':'Adicionar ao estoque'}</button>
    </form>`);
  refreshStockFormDynamic(initialTipo, item);
  document.getElementById('tipoSelect').onchange = (e)=>{ refreshStockFormDynamic(e.target.value, null); };
  document.querySelector('#stockForm [name="minStock"]').addEventListener('input', e=>{ e.target.dataset.touched='1'; });
  wireDateTimeFields(document.getElementById('stockForm'));
  document.getElementById('stockCartaoPessoal').onchange = e=>{
    document.getElementById('stockCartaoVencimentoWrap').style.display = e.target.checked ? '' : 'none';
  };

  document.getElementById('stockForm').onsubmit = async (e)=>{
    e.preventDefault(); const f=e.target;
    const tipoKey = f.elements.tipo.value;
    const tipo = TIPOS[tipoKey];
    const extraValues = {};
    tipo.extraFields.forEach(fld=>{ if(fld.transient) return; const el=f.elements['ef_'+fld.key]; if(el) extraValues[fld.key] = fld.numeric ? (parseFloat(el.value)||0) : el.value.trim(); });
    let unit = tipo.unitChoices ? f.elements.unit.value : tipo.unit;
    const custoTotalPago = parseFloat(f.elements.custoTotalPago.value)||0;
    let minStock = parseFloat(f.elements.minStock.value)||0;
    const name = tipo.nameFn(extraValues);

    if(item){
      let quantityBought = parseFloat(f.elements.quantityBought.value)||0;
      let quantityHave = parseFloat(f.elements.quantity.value)||0;
      if(tipoKey==='sabonete' && unit==='L'){ quantityBought = round2(quantityBought*1000); quantityHave = round2(quantityHave*1000); minStock = round2(minStock*1000); unit='ml'; }
      const costPerUnit = quantityBought>0 ? round4(custoTotalPago/quantityBought) : 0;
      await colUpdate('stock', item.id, {name, category:tipoKey, unit, ...extraValues, quantity:quantityHave, costPerUnit, minStock});
      if(f.elements.cartaoPessoal.checked) await addReembolso(name, custoTotalPago, 'estoque', f.elements.cartaoVencimentoBR.value);
      closeModal(); return;
    }
    let quantity = parseFloat(f.elements.quantity.value)||0;
    if(tipoKey==='sabonete' && unit==='L'){ quantity = round2(quantity*1000); minStock = round2(minStock*1000); unit='ml'; }
    const costPerUnit = quantity>0 ? round4(custoTotalPago/quantity) : 0;
    const data = {name, category:tipoKey, unit, ...extraValues};
    const existing = state.stock.find(s=> s.category===tipoKey && (s.name||'').toLowerCase()===name.toLowerCase());
    if(existing){
      const oldQty = existing.quantity||0, oldCost = existing.costPerUnit||0;
      const newQty = round2(oldQty+quantity);
      const newCost = newQty>0 ? round4(((oldQty*oldCost)+(quantity*costPerUnit))/newQty) : costPerUnit;
      await colUpdate('stock', existing.id, {quantity:newQty, costPerUnit:newCost, minStock: minStock||existing.minStock});
    } else {
      await colAdd('stock', {...data, quantity, costPerUnit, minStock, createdAt:new Date().toISOString()});
    }
    if(f.elements.cartaoPessoal.checked) await addReembolso(name, custoTotalPago, 'estoque', f.elements.cartaoVencimentoBR.value);
    closeModal();
  };
}

      <button type="submit" class="btn block">Registrar compra</button>
    </form>`);
  document.getElementById('restockForm').onsubmit = async (e)=>{
    e.preventDefault(); const f=e.target;
    const addedQty = parseFloat(f.elements.qty.value)||0;
    const totalPago = f.elements.totalPago.value ? parseFloat(f.elements.totalPago.value) : null;
    const purchaseUnitCost = (totalPago!==null && addedQty>0) ? totalPago/addedQty : null;
    const oldQty = item.quantity||0, oldCost = item.costPerUnit||0;
    const newQty = round2(oldQty+addedQty);
    let newCost = oldCost;
    if(purchaseUnitCost!==null){
      newCost = newQty>0 ? round4(((oldQty*oldCost)+(addedQty*purchaseUnitCost))/newQty) : purchaseUnitCost;
    }
    await colUpdate('stock', item.id, {quantity:newQty, costPerUnit:newCost});
    closeModal();
  };
}
function deleteStock(id){
  const item = state.stock.find(x=>x.id===id);
  if(!item) return;
  confirmModal(`Remover "${escapeHtml(item.name)}" do estoque?`, async ()=>{ await colDelete('stock', id); });
}

/* ---- mimo pronto (composed stock item) ---- */
let activeRecipe = [];
function recipeUnitLabel(item){ return item ? (item.category==='pomada' ? 'g' : (UNIT_LABELS[item.unit]||item.unit)) : ''; }
function recipeLineNativeQty(item, qty){
  if(!item) return 0;
  if(item.category==='pomada'){ const gpu = Number(item.gramsPerUnit)||1; return qty/gpu; }
  return qty;
}
function recipeLineCost(item, qty){
  if(!item) return 0;
  return recipeLineNativeQty(item, qty) * (item.costPerUnit||0);
}
function renderRecipeRows(){
  const container = document.getElementById('recipeRows');
  if(!container) return;
  const nonMimoStock = state.stock.filter(s=>s.category!==MIMO_CATEGORY);
  const rowsHtml = activeRecipe.map((r,i)=>{
    const item = nonMimoStock.find(s=>s.id===r.stockId);
    return `
    <div class="consump-row">
      <select data-ridx="${i}" data-role="rstock"><option value="">Selecionar item…</option>${nonMimoStock.map(s=>`<option value="${s.id}" ${s.id===r.stockId?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select>
      <input type="number" step="0.01" min="0" data-ridx="${i}" data-role="rqty" value="${r.qty||''}" placeholder="qtd" />
      <button type="button" class="icon-btn" data-ridx="${i}" data-role="rremove">${ICONS.close}</button>
    </div>
    ${item?`<div class="hint" style="margin:-4px 0 8px;">em ${recipeUnitLabel(item)} · custo ${brl(recipeLineCost(item, r.qty||0))} por mimo</div>`:''}`;
  }).join('');
  const totalCost = activeRecipe.reduce((s,r)=>{ const item=nonMimoStock.find(x=>x.id===r.stockId); return s+recipeLineCost(item, r.qty||0); },0);
  container.innerHTML = rowsHtml + `<div class="cost-preview"><span>Custo estimado por Mimo</span><b>${brl(totalCost)}</b></div>`;
  container.querySelectorAll('[data-role="rstock"]').forEach(el=>{ el.onchange = e=>{ activeRecipe[+e.target.dataset.ridx].stockId = e.target.value; renderRecipeRows(); }; });
  container.querySelectorAll('[data-role="rqty"]').forEach(el=>{ el.oninput = e=>{ activeRecipe[+e.target.dataset.ridx].qty = parseFloat(e.target.value)||0; renderRecipeRows(); }; });
  container.querySelectorAll('[data-role="rremove"]').forEach(el=>{ el.onclick = e=>{ activeRecipe.splice(+e.currentTarget.dataset.ridx,1); renderRecipeRows(); }; });
}
function computeRecipeCost(recipe){
  return (recipe||[]).reduce((s,r)=>{ const item=state.stock.find(x=>x.id===r.stockId); return s+recipeLineCost(item, r.qty||0); },0);
}
function openMimoRecipeForm(){
  const mimo = getMimoItem();
  activeRecipe = mimo && mimo.recipe ? mimo.recipe.map(r=>({...r})) : [
    {stockId: (state.stock.find(s=>s.category==='cartaoPosTattoo')||{}).id || '', qty:1},
    {stockId: (state.stock.find(s=>s.category==='potinho')||{}).id || '', qty:1},
    {stockId: (state.stock.find(s=>s.category==='pomada')||{}).id || '', qty:3},
  ];
  openModal(mimo?'Editar composição · Mimo pronto':'Configurar Mimo pronto', `
    <form id="mimoRecipeForm">
      ${mimo?`
      <div class="field"><label>Quantidade atual em estoque (un)</label><input name="quantity" type="number" step="0.01" min="0" value="${mimo.quantity}" /></div>
      <div class="hint" style="margin:-8px 0 14px;">Ajuste aqui se já tiver mimos prontos feitos hoje sem passar pelo "Produzir", ou pra corrigir a contagem. O custo por unidade é sempre recalculado automaticamente a partir do custo atual dos insumos da composição abaixo.</div>
      `:''}
      <div class="field"><label>Estoque mínimo (un)</label><input name="minStock" type="number" step="0.01" min="0" value="${mimo?mimo.minStock:5}" /></div>
      <div class="field">
        <label>Composição (o que 1 Mimo consome)</label>
        <div id="recipeRows"></div>
        <button type="button" class="btn secondary" id="addRecipeBtn" style="margin-top:4px;">${ICONS.plus} Adicionar componente</button>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn block">${mimo?'Salvar':'Criar Mimo pronto'}</button>
      </div>
      ${mimo?`<button type="button" class="btn danger block" id="removeMimoBtn" style="margin-top:8px;">Remover Mimo pronto</button>`:''}
    </form>`);
  renderRecipeRows();
  document.getElementById('addRecipeBtn').onclick = ()=>{ activeRecipe.push({stockId:'', qty:1}); renderRecipeRows(); };
  const removeBtn = document.getElementById('removeMimoBtn');
  if(removeBtn) removeBtn.onclick = ()=>{
    confirmModal('Remover o Mimo pronto e a composição configurada? Isso não afeta os insumos individuais no estoque.', async ()=>{ await colDelete('stock', mimo.id); });
  };
  document.getElementById('mimoRecipeForm').onsubmit = async (e)=>{
    e.preventDefault(); const f=e.target;
    const recipe = activeRecipe.filter(r=>r.stockId && r.qty>0).map(r=>({stockId:r.stockId, qty:r.qty}));
    const minStock = parseFloat(f.elements.minStock.value)||0;
    const costPerUnit = round2(computeRecipeCost(recipe));
    if(mimo){
      const quantity = parseFloat(f.elements.quantity.value)||0;
      await colUpdate('stock', mimo.id, {recipe, minStock, quantity, costPerUnit});
    } else {
      await colAdd('stock', {name:'Mimo pronto', category:MIMO_CATEGORY, unit:'un', quantity:0, costPerUnit, minStock, recipe, createdAt:new Date().toISOString()});
    }
    closeModal();
  };
}
function openProduceMimoForm(){
  const mimo = getMimoItem();
  if(!mimo || !mimo.recipe || !mimo.recipe.length){ openMimoRecipeForm(); return; }
  const preview = mimo.recipe.map(r=>{
    const item = state.stock.find(s=>s.id===r.stockId);
    return `<div class="row-sub">${item?escapeHtml(item.name):'item removido'} — ${r.qty} ${item?recipeUnitLabel(item):''} por mimo${item?` (${item.quantity} ${UNIT_LABELS[item.unit]||item.unit} em estoque)`:''}</div>`;
  }).join('');
  openModal('Produzir Mimo pronto', `
    <form id="produceMimoForm">
      <div class="field"><label>Quantidade a produzir</label><input name="qty" type="number" step="1" min="1" value="1" required /></div>
      <div class="field"><label>Composição usada por mimo</label>${preview}</div>
      <button type="submit" class="btn block">Produzir e descontar do estoque</button>
    </form>`);
  document.getElementById('produceMimoForm').onsubmit = async (e)=>{
    e.preventDefault(); const f=e.target;
    const producedQty = parseFloat(f.elements.qty.value)||0;
    if(producedQty<=0){ closeModal(); return; }
    let batchCost = 0;
    for(const r of mimo.recipe){
      const item = state.stock.find(s=>s.id===r.stockId);
      if(!item) continue;
      const nativeQtyTotal = recipeLineNativeQty(item, r.qty) * producedQty;
      batchCost += nativeQtyTotal * (item.costPerUnit||0);
      await adjustStock(item.id, -Math.abs(nativeQtyTotal));
    }
    const unitCostThisBatch = producedQty>0 ? batchCost/producedQty : 0;
    const oldQty = mimo.quantity||0, oldCost = mimo.costPerUnit||0;
    const newQty = round2(oldQty+producedQty);
    const newCost = newQty>0 ? round2(((oldQty*oldCost)+(producedQty*unitCostThisBatch))/newQty) : unitCostThisBatch;
    await colUpdate('stock', mimo.id, {quantity:newQty, costPerUnit:newCost});
    closeModal();
  };
}

/* ---- shopping form ---- */
function openShoppingForm(){
  openModal('Adicionar à lista de compras', `
    <form id="shoppingForm">
      <div class="field"><label>Item</label><input name="name" required placeholder="Ex.: Tinta Dynamic Black" /></div>
      <div class="field-row">
        <div class="field"><label>Quantidade (opcional)</label><input name="qty" placeholder="Ex.: 2 potes" /></div>
        <div class="field"><label>Nota (opcional)</label><input name="note" placeholder="Ex.: loja X" /></div>
      </div>
      <button type="submit" class="btn block">Adicionar</button>
    </form>`);
  document.getElementById('shoppingForm').onsubmit = async (e)=>{
    e.preventDefault(); const f=e.target;
    await colAdd('shopping', {name:f.elements.name.value.trim(), qty:f.elements.qty.value.trim(), note:f.elements.note.value.trim(), done:false, createdAt:new Date().toISOString()});
    closeModal();
  };
}
function toggleShopping(id){
  const s = state.shopping.find(x=>x.id===id);
  if(!s) return;
  colUpdate('shopping', id, {done: !s.done});
}
function deleteShopping(id){ colDelete('shopping', id); }
async function addLowStockToShopping(){
  const low = lowStockItems();
  for(const item of low){
    const already = state.shopping.some(s=>!s.done && s.name===item.name);
    if(!already) await colAdd('shopping', {name:item.name, qty:'', note:'estoque baixo', done:false, createdAt:new Date().toISOString()});
  }
}

document.getElementById('main').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');

  const action = el.dataset.action;
  if(atalhosOpen && action!=='toggleAtalhos'){ atalhosOpen = false; }
  if(actions[action]) actions[action](el.dataset.id, el);
});
document.getElementById('navlist').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-nav]');
  if(!el) return;
  activeTab = el.dataset.nav; activeEventId=null; renderApp();
});

/* ============ THEME ============ */
function prefersDark(){
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
  catch(e){ return false; }
}
function initTheme(){
  try{
    const saved = localStorage.getItem('ftc-theme');
    if(saved) document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
  updateThemeIcon();
}
function updateThemeIcon(){
  const current = document.documentElement.getAttribute('data-theme');
  const isDark = current==='dark' || (!current && prefersDark());
  document.getElementById('themeToggle').innerHTML = isDark ? ICONS.sun : ICONS.moon;
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const current = document.documentElement.getAttribute('data-theme');
  const isDark = current==='dark' || (!current && prefersDark());
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('ftc-theme', next); }catch(e){}
  updateThemeIcon();
});

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  if(supa) await supa.auth.signOut();
});

/* ============ INIT ============ */
try{ initTheme(); }catch(e){ console.error('theme init failed', e); }
renderApp();
initDb();
